<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRYO ARCHIVE // SCHEDULE MATRIX</title>

  <!-- Google API SDK (供 Google Drive 雲端同步使用) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- 引入等寬英數輔助字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Cinzel:wght@700;900&family=EB+Garamond:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    /* 讀取同目錄下的 Celtic Garamond the 2nd 字型檔，並提供 ttf / otf 多重路徑支援 */
    @font-face {
      font-family: 'Celtic Garamond the 2nd';
      src: url('./Celtic Garamond the 2nd.ttf') format('truetype'),
           url('./Celtic Garamond the 2nd.otf') format('opentype'),
           url('./CelticGaramondthe2nd.ttf') format('truetype'),
           url('./CelticGaramondthe2nd.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 全局 CSS 變數：支援三大系統連動 */
    :root {
      --bg-color: #002be8;     /* 藍色系：底色、槽位底色、次要按鈕底色 */
      --header-bg: #000000;    /* 黑色系：標題列、導覽列、表頭、底板 */
      --accent-color: #e2ff00; /* 螢光黃系：大標題、TODAY按鈕、時間文字、選取光暈 */
      --text-color: #ffffff;
      
      --font-ui: "Space Mono", "Consolas", "Courier New", monospace;
      --font-card: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      font-family: var(--font-ui);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 頂部列 */
    header {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--header-bg);
      padding: 6px 14px 4px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 30;
    }

    /* 大標題：專用 Celtic Garamond the 2nd 字型 (帶有古典/凱爾特襯線字型備援) */
    .hero-period-display {
      font-family: 'Celtic Garamond the 2nd', 'CelticGaramondthe2nd', 'EB Garamond', 'Cinzel', 'Garamond', serif !important;
      font-size: 27px;
      font-weight: normal;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 4px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 3px var(--accent-color);
    }

    .hero-period-display span,
    .hero-period-display .slash {
      font-family: 'Celtic Garamond the 2nd', 'CelticGaramondthe2nd', 'EB Garamond', 'Cinzel', 'Garamond', serif !important;
    }

    .hero-period-display .slash {
      color: var(--accent-color);
      margin: 0 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      font-family: var(--font-ui);
      background-color: #ffffff;
      color: var(--header-bg);
      border: 2px solid var(--header-bg);
      padding: 3px 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button.accent {
      background-color: var(--accent-color);
      border-color: var(--header-bg);
      color: var(--header-bg);
    }

    button.secondary {
      background-color: var(--bg-color);
      border-color: #ffffff;
      color: #ffffff;
    }

    button.danger {
      background-color: #ff3344;
      border-color: var(--header-bg);
      color: #ffffff;
    }

    button.icon-btn {
      padding: 3px 7px;
      font-size: 13px;
      line-height: 1;
    }

    button:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px var(--header-bg);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 齒輪自訂選單彈窗 */
    .settings-modal {
      position: absolute;
      top: 48px;
      right: 14px;
      background: var(--header-bg);
      border: 2px solid #ffffff;
      box-shadow: 4px 4px 0px var(--header-bg);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      min-width: 280px;
      max-width: 340px;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .color-picker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .google-sync-section {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .google-sync-section label {
      font-size: 10px;
      color: var(--accent-color);
      font-weight: 700;
    }

    .google-sync-section input[type="text"] {
      width: 100%;
      font-size: 10px;
      padding: 4px 6px;
    }

    input[type="color"] {
      border: 1px solid #ffffff;
      width: 24px;
      height: 24px;
      cursor: pointer;
      background: none;
    }

    /* 週次巡航列 */
    .calendar-nav-bar {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--header-bg);
      padding: 4px 14px 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 25;
    }

    .nav-section {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lock-status {
      font-family: var(--font-ui);
      font-size: 10px;
      color: #777777;
      letter-spacing: 1px;
      font-weight: 700;
    }

    /* 矩陣排程主要容器 */
    .schedule-container {
      flex: 1;
      overflow: auto;
      padding: 6px 14px 12px 14px;
      position: relative;
    }

    .grid-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      border-left: 2px solid var(--header-bg);
      border-top: 2px solid var(--header-bg);
      background: var(--header-bg);
    }

    .grid-table th, .grid-table td {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    /* 頂部日期表頭（凍結窗格） */
    .grid-table th {
      font-family: var(--font-ui);
      background-color: var(--header-bg);
      color: #ffffff;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      position: sticky;
      top: 0;
      z-index: 15;
      border-bottom: 2px solid #ffffff;
    }

    .grid-table th.today-header {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    /* 左側時間軸（凍結窗格） */
    .time-col {
      font-family: var(--font-ui);
      width: 75px;
      min-width: 75px;
      max-width: 75px;
      font-size: 11px;
      font-weight: 700;
      background-color: var(--header-bg);
      color: var(--accent-color);
      letter-spacing: 0.5px;
      position: sticky;
      left: 0;
      z-index: 14;
      border-right: 2px solid #ffffff !important;
    }

    th.time-col {
      z-index: 20 !important;
      border-bottom: 2px solid #ffffff !important;
    }

    /* 槽位單元格 */
    .slot-cell {
      background-color: var(--bg-color);
      height: 48px;
      vertical-align: middle;
      padding: 2px;
      transition: background-color 0.1s;
    }

    .slot-cell.drag-over {
      background-color: var(--accent-color) !important;
      outline: 2px dashed var(--header-bg);
    }

    /* 下方卡帶操作台 */
    .dock-area {
      background-color: var(--header-bg);
      border-top: 3px solid #ffffff;
      padding: 8px 14px;
      height: 190px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      box-shadow: 0px -4px 12px rgba(0,0,0,0.6);
    }

    .workbench-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .workbench-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .workbench-divider {
      width: 2px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dock-slots {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      padding: 6px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .tape-card {
      background-color: #ffffff;
      color: var(--header-bg);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 96%;
      margin: 0 auto;
      height: 36px;
      padding: 0 10px;
      border: 2px solid var(--header-bg);
      box-shadow: 2px 2px 0px var(--header-bg);
      position: relative;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .tape-card::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 3px;
      background: var(--header-bg);
      opacity: 0.35;
    }

    /* 過期卡帶自動消隱（變 CELL 色） */
    .tape-card.passed-card {
      background-color: var(--bg-color) !important;
      color: rgba(255, 255, 255, 0.45) !important;
      border-color: var(--header-bg) !important;
      box-shadow: 1px 1px 0px var(--header-bg);
    }

    .tape-card.passed-card::before {
      background: var(--header-bg);
      opacity: 0.2;
    }

    .tape-card.passed-card span {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .tape-card.passed-card .card-meta-code {
      color: rgba(255, 255, 255, 0.35) !important;
    }

    .dock-slots .tape-card {
      width: 170px;
      flex-shrink: 0;
    }

    .tape-card.selected {
      border: 2px solid var(--accent-color) !important;
      box-shadow: 0 0 10px var(--accent-color), 2px 2px 0px var(--header-bg) !important;
    }

    .tape-card:active {
      cursor: grabbing;
      transform: translate(1px, 1px);
    }

    .tape-card span {
      font-family: var(--font-card);
      font-size: 11px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      padding-left: 4px;
      letter-spacing: 0.5px;
    }

    .card-meta-code {
      font-family: var(--font-ui);
      font-size: 8.5px;
      opacity: 0.45;
      pointer-events: none;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      font-family: var(--font-card);
      background-color: var(--header-bg);
      color: var(--accent-color);
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .hint-text {
      font-family: var(--font-ui);
      font-size: 10px;
      color: #777777;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header>
    <div class="hero-period-display" id="period-display">
      <span>2026</span><span class="slash">//</span><span>MONTH 09</span><span class="slash">//</span><span>WEEK 03</span>
    </div>

    <div class="header-actions">
      <button class="secondary" onclick="exportData()">EXPORT.DAT</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">LOAD.DAT</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)" />
      
      <button class="icon-btn" onclick="toggleSettingsModal(event)" title="COLOR & SYNC CONFIG">⚙</button>
    </div>

    <!-- 齒輪設定彈窗 -->
    <div class="settings-modal" id="settings-modal" onclick="event.stopPropagation()">
      <div class="settings-header">
        <span>SYSTEM CONFIG</span>
        <span style="cursor: pointer;" onclick="toggleSettingsModal(event)">✕</span>
      </div>
      
      <div class="color-picker-row">
        <span>藍色系統 (ENV / CELL)</span>
        <input type="color" id="picker-bg" value="#002be8" onchange="updateThemeColor('--bg-color', this.value)" />
      </div>
      <div class="color-picker-row">
        <span>黑色系統 (PANEL / BAR)</span>
        <input type="color" id="picker-header" value="#000000" onchange="updateThemeColor('--header-bg', this.value)" />
      </div>
      <div class="color-picker-row">
        <span>螢光黃系統 (HERO / FOCUS)</span>
        <input type="color" id="picker-accent" value="#e2ff00" onchange="updateThemeColor('--accent-color', this.value)" />
      </div>

      <!-- Google 雲端硬碟自動同步面板 -->
      <div class="google-sync-section">
        <label>GOOGLE DRIVE SYNC (APP DATA)</label>
        <input type="text" id="google-client-id" placeholder="OAuth Client ID..." onchange="handleSaveClientId(this.value)" />
        <div style="display: flex; gap: 4px; margin-top: 4px;">
          <button id="btn-gdrive-auth" class="accent" style="flex: 1;" onclick="handleAuthGoogleDrive()">登入 GOOGLE</button>
          <button id="btn-gdrive-sync" class="secondary" style="flex: 1;" disabled onclick="syncFromGoogleDrive()">雲端載入</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 週次導覽列 -->
  <div class="calendar-nav-bar">
    <div class="nav-section">
      <button class="secondary" onclick="navigateMonth(-1)">◀ PREV MONTH</button>
      <button class="secondary" onclick="navigateWeek(-1)">◀ PREV WEEK</button>
      <button class="accent" onclick="jumpToCurrentDate()">TODAY</button>
      <button class="secondary" onclick="navigateWeek(1)">NEXT WEEK ▶</button>
      <button class="secondary" onclick="navigateMonth(1)">NEXT MONTH ▶</button>
    </div>

    <div class="lock-status" id="sync-status">
      [SYNC: LOCAL DATA PERSISTED]
    </div>
  </div>

  <!-- 矩陣排程槽位 -->
  <div class="schedule-container" onclick="deselectCard(event)">
    <table class="grid-table">
      <thead>
        <tr id="schedule-header-row">
          <th class="time-col">T-BLOCK</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </div>

  <!-- 下方卡帶操作台 -->
  <div class="dock-area">
    <div class="workbench-toolbar">
      <div class="workbench-section">
        <input type="text" id="new-card-text" placeholder="輸入待辦事項..." style="width: 170px;" />
        <input type="color" id="new-card-color" value="#ffffff" title="CARTRIDGE COLOR" />
        <button class="accent" onclick="handleCreateCard()">+ 製作卡帶</button>
      </div>

      <div class="workbench-divider"></div>

      <div class="workbench-section">
        <span style="font-size: 10px; font-weight: 700; color: #888;">TARGET CONFIG:</span>
        <input type="text" id="edit-card-text" placeholder="未選取卡帶" style="width: 170px;" disabled oninput="handleUpdateSelectedText(this.value)" />
        <input type="color" id="edit-card-color" value="#ffffff" disabled onchange="handleUpdateSelectedColor(this.value)" />
        <button id="btn-duplicate" class="secondary" disabled onclick="handleDuplicateSelected()">複製</button>
        <button id="btn-delete" class="danger" disabled onclick="handleDeleteSelected()">刪除</button>
      </div>

      <span class="hint-text" style="margin-left: auto;">
        [ALT + 拖曳]: 快速複製投放 / 點擊卡帶在下方操作台編輯
      </span>
    </div>

    <div class="dock-slots" id="dock-container" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'dock')" onclick="deselectCard(event)"></div>
  </div>

  <script>
    const TIME_SLOTS = [
      "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", 
      "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", 
      "19:00", "20:00", "21:00", "22:00", "23:00"
    ];
    const DAY_NAMES = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    // 預設 Client ID
    const DEFAULT_GOOGLE_CLIENT_ID = "865993916714-o0h883itsqd3lvgbatmkgqrqqhbrmuhf.apps.googleusercontent.com";

    let state = {
      theme: {
        "--bg-color": "#002be8",
        "--header-bg": "#000000",
        "--accent-color": "#e2ff00"
      },
      cards: {}
    };

    let currentAnchorDate = new Date();
    let displayedWeekDates = [];

    let draggedCardId = null;
    let isAltCloneMode = false;
    let selectedCardId = null;

    // Google API 授權與同步狀態
    const GDRIVE_FILE_NAME = "cryo_schedule_data.json";
    const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
    let tokenClient = null;
    let googleAccessToken = null;
    let gdriveFileId = null;
    let cloudDebounceTimer = null;

    function init() {
      loadFromStorage();
      applyTheme();
      updateWeekTimeline();
      updateWorkbenchUI();
      initGoogleAuthSettings();

      document.addEventListener("click", () => {
        const modal = document.getElementById("settings-modal");
        if (modal) modal.classList.remove("active");
      });

      // 每分鐘自動檢視時間，過期卡帶即時變為 CELL 底色
      setInterval(() => {
        renderAllCards();
      }, 60000);
    }

    /* ========================================================
       GOOGLE 雲端儲存 (DRIVE APPDATA) 授權與同步引擎
       ======================================================== */
    function initGoogleAuthSettings() {
      const savedClientId = localStorage.getItem("gdrive_sync_client_id") || DEFAULT_GOOGLE_CLIENT_ID;
      const input = document.getElementById("google-client-id");
      if (input) input.value = savedClientId;
      setupTokenClient(savedClientId);
    }

    function handleSaveClientId(val) {
      const clientId = val.trim() || DEFAULT_GOOGLE_CLIENT_ID;
      localStorage.setItem("gdrive_sync_client_id", clientId);
      setupTokenClient(clientId);
      alert("GOOGLE CLIENT ID 已儲存！請點選「登入 GOOGLE」完成授權。");
    }

    function setupTokenClient(clientId) {
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        // 若 SDK 尚未下載完成，延遲 300ms 再重試
        setTimeout(() => setupTokenClient(clientId), 300);
        return;
      }
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: GDRIVE_SCOPE,
          callback: async (resp) => {
            if (resp.error) {
              console.error("GOOGLE AUTH FAILED", resp);
              alert("授權失敗：" + resp.error);
              return;
            }
            googleAccessToken = resp.access_token;
            document.getElementById("btn-gdrive-auth").textContent = "已連結 GOOGLE";
            document.getElementById("btn-gdrive-sync").disabled = false;
            document.getElementById("sync-status").textContent = "[SYNC: GOOGLE DRIVE LINKED]";
            await syncFromGoogleDrive();
          }
        });
      } catch (e) {
        console.error("TokenClient init error:", e);
      }
    }

    function handleAuthGoogleDrive() {
      const clientId = (document.getElementById("google-client-id").value || DEFAULT_GOOGLE_CLIENT_ID).trim();
      if (!tokenClient) setupTokenClient(clientId);
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: "" });
      } else {
        alert("Google 認證庫尚未載入完成，請確認網路連線正常或稍候幾秒再試！");
      }
    }

    async function syncFromGoogleDrive() {
      if (!googleAccessToken) return;
      document.getElementById("sync-status").textContent = "[SYNC: FETCHING FROM CLOUD...]";

      try {
        const query = encodeURIComponent(`name = '${GDRIVE_FILE_NAME}' and trashed = false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&fields=files(id,name)`, {
          headers: { Authorization: `Bearer ${googleAccessToken}` }
        });
        const listData = await listRes.json();

        if (listData.files && listData.files.length > 0) {
          gdriveFileId = listData.files[0].id;
          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${gdriveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${googleAccessToken}` }
          });
          const cloudState = await fileRes.json();

          if (cloudState && cloudState.cards) {
            state = cloudState;
            saveToStorage(false);
            applyTheme();
            renderAllCards();
            document.getElementById("sync-status").textContent = "[SYNC: CLOUD SYNCED]";
            return;
          }
        } else {
          await saveToGoogleDrive();
        }
      } catch (err) {
        console.error("CLOUD SYNC ERROR", err);
        document.getElementById("sync-status").textContent = "[SYNC: CLOUD ERROR]";
      }
    }

    async function saveToGoogleDrive() {
      if (!googleAccessToken) return;

      const fileContent = JSON.stringify(state, null, 2);
      const boundary = "-------314159265358979323846";
      const delimiter = "\r\n--" + boundary + "\r\n";
      const closeDelim = "\r\n--" + boundary + "--";

      try {
        if (!gdriveFileId) {
          const metadata = {
            name: GDRIVE_FILE_NAME,
            parents: ["appDataFolder"]
          };
          const multipartRequestBody =
            delimiter +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            JSON.stringify(metadata) +
            delimiter +
            'Content-Type: application/json\r\n\r\n' +
            fileContent +
            closeDelim;

          const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${googleAccessToken}`,
              "Content-Type": `multipart/related; boundary=${boundary}`
            },
            body: multipartRequestBody
          });
          const data = await res.json();
          if (data.id) gdriveFileId = data.id;
        } else {
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gdriveFileId}?uploadType=media`, {
            method: "PATCH",
            headers: {
              Authorization: `Bearer ${googleAccessToken}`,
              "Content-Type": "application/json"
            },
            body: fileContent
          });
        }
        document.getElementById("sync-status").textContent = "[SYNC: GOOGLE DRIVE SAVED]";
      } catch (err) {
        console.error("GDRIVE SAVE ERROR", err);
      }
    }

    /* ========================================================
       本機持久化儲存與防抖雲端連動
       ======================================================== */
    function loadFromStorage() {
      const saved = localStorage.getItem("schedule_cryo_matrix_clean");
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("LOAD ERROR", e);
        }
      }
    }

    function saveToStorage(triggerCloud = true) {
      localStorage.setItem("schedule_cryo_matrix_clean", JSON.stringify(state));

      if (triggerCloud && googleAccessToken) {
        document.getElementById("sync-status").textContent = "[SYNC: PENDING CLOUD...]";
        clearTimeout(cloudDebounceTimer);
        cloudDebounceTimer = setTimeout(() => {
          saveToGoogleDrive();
        }, 1000);
      }
    }

    function toggleSettingsModal(e) {
      e.stopPropagation();
      const modal = document.getElementById("settings-modal");
      modal.classList.toggle("active");
    }

    function updateThemeColor(cssVar, color) {
      state.theme[cssVar] = color;
      applyTheme();
      saveToStorage();
    }

    function applyTheme() {
      for (const [key, val] of Object.entries(state.theme)) {
        document.documentElement.style.setProperty(key, val);
      }
      if (document.getElementById("picker-bg")) document.getElementById("picker-bg").value = state.theme["--bg-color"] || "#002be8";
      if (document.getElementById("picker-header")) document.getElementById("picker-header").value = state.theme["--header-bg"] || "#000000";
      if (document.getElementById("picker-accent")) document.getElementById("picker-accent").value = state.theme["--accent-color"] || "#e2ff00";
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDateKey(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getWeekOfMonth(date) {
      const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      let firstMondayOffset = firstDayOfMonth.getDay() - 1;
      if (firstMondayOffset === -1) firstMondayOffset = 6;
      const dayOfMonth = date.getDate();
      return Math.ceil((dayOfMonth + firstMondayOffset) / 7);
    }

    function isSlotPassed(slotId) {
      if (!slotId || slotId === "dock") return false;

      const parts = slotId.split("_");
      if (parts.length < 2) return false;

      const dateStr = parts[0];
      const sIdx = parseInt(parts[1], 10);
      const timeStr = TIME_SLOTS[sIdx];

      if (!timeStr) return false;

      const [hour] = timeStr.split(":").map(Number);
      const slotEndDateTime = new Date(`${dateStr}T${String(hour).padStart(2, "0")}:59:59`);

      return new Date() > slotEndDateTime;
    }

    function navigateWeek(direction) {
      currentAnchorDate.setDate(currentAnchorDate.getDate() + direction * 7);
      updateWeekTimeline();
    }

    function navigateMonth(direction) {
      currentAnchorDate.setMonth(currentAnchorDate.getMonth() + direction);
      updateWeekTimeline();
    }

    function jumpToCurrentDate() {
      currentAnchorDate = new Date();
      updateWeekTimeline();
    }

    function updateWeekTimeline() {
      const monday = getMonday(currentAnchorDate);
      displayedWeekDates = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        displayedWeekDates.push(d);
      }

      const midWeek = displayedWeekDates[3];
      const year = midWeek.getFullYear();
      const month = String(midWeek.getMonth() + 1).padStart(2, "0");
      const weekOfMonth = String(getWeekOfMonth(midWeek)).padStart(2, "0");
      
      document.getElementById("period-display").innerHTML = `
        <span>${year}</span><span class="slash">//</span><span>MONTH ${month}</span><span class="slash">//</span><span>WEEK ${weekOfMonth}</span>
      `;

      renderHeaderRow();
      renderGridBody();
      renderAllCards();
    }

    function renderHeaderRow() {
      const headerRow = document.getElementById("schedule-header-row");
      headerRow.innerHTML = '<th class="time-col">T-BLOCK</th>';

      const todayStr = formatDateKey(new Date());

      displayedWeekDates.forEach((d, idx) => {
        const th = document.createElement("th");
        const dateKey = formatDateKey(d);
        const mmdd = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;

        if (dateKey === todayStr) {
          th.classList.add("today-header");
        }

        th.textContent = `${DAY_NAMES[idx]} // ${mmdd}`;
        headerRow.appendChild(th);
      });
    }

    function renderGridBody() {
      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      TIME_SLOTS.forEach((time, sIdx) => {
        const row = document.createElement("tr");

        const timeTd = document.createElement("td");
        timeTd.className = "time-col";
        timeTd.textContent = time;
        row.appendChild(timeTd);

        displayedWeekDates.forEach((d) => {
          const td = document.createElement("td");
          td.className = "slot-cell";
          const dateKey = formatDateKey(d);
          const slotId = `${dateKey}_${sIdx}`;
          td.dataset.slotId = slotId;

          td.ondragover = (e) => allowDrop(e);
          td.ondragleave = (e) => e.currentTarget.classList.remove("drag-over");
          td.ondrop = (e) => handleDrop(e, slotId);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    function createCardElement(card) {
      const div = document.createElement("div");
      div.id = card.id;
      div.draggable = true;

      const passed = isSlotPassed(card.slot);

      let classList = "tape-card";
      if (card.id === selectedCardId) classList += " selected";
      if (passed) classList += " passed-card";
      div.className = classList;

      if (!passed) {
        div.style.backgroundColor = card.color;
      }

      div.ondragstart = (e) => {
        draggedCardId = card.id;
        isAltCloneMode = e.altKey;
        e.dataTransfer.setData("text/plain", card.id);
      };

      div.onclick = (e) => {
        e.stopPropagation();
        selectCard(card.id);
      };

      const titleSpan = document.createElement("span");
      titleSpan.textContent = card.text;

      const metaTag = document.createElement("div");
      metaTag.className = "card-meta-code";
      metaTag.textContent = passed ? "PASS" : card.id.slice(-4);

      div.appendChild(titleSpan);
      div.appendChild(metaTag);

      return div;
    }

    function renderAllCards() {
      document.querySelectorAll(".slot-cell").forEach(cell => cell.innerHTML = "");
      document.getElementById("dock-container").innerHTML = "";

      Object.values(state.cards).forEach(card => {
        const el = createCardElement(card);
        if (card.slot === "dock" || !card.slot) {
          document.getElementById("dock-container").appendChild(el);
        } else {
          const targetSlot = document.querySelector(`[data-slot-id="${card.slot}"]`);
          if (targetSlot) {
            targetSlot.appendChild(el);
          }
        }
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      if (e.currentTarget.classList) {
        e.currentTarget.classList.add("drag-over");
      }
    }

    function handleDrop(e, targetSlotId) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");

      if (!draggedCardId || !state.cards[draggedCardId]) return;

      const sourceCard = state.cards[draggedCardId];
      const isAltPressed = e.altKey || isAltCloneMode;

      if (isAltPressed) {
        const newId = "CRYO_" + Date.now().toString().slice(-6);
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard) existingCard.slot = "dock";
        }
        state.cards[newId] = {
          id: newId,
          text: sourceCard.text,
          color: sourceCard.color,
          slot: targetSlotId
        };
        selectCard(newId);
      } else {
        const previousSlot = sourceCard.slot;
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard && existingCard.id !== sourceCard.id) {
            existingCard.slot = previousSlot;
          }
        }
        sourceCard.slot = targetSlotId;
        selectCard(sourceCard.id);
      }

      draggedCardId = null;
      isAltCloneMode = false;
      saveToStorage();
      renderAllCards();
    }

    function selectCard(cardId) {
      selectedCardId = cardId;
      updateWorkbenchUI();
      renderAllCards();
    }

    function deselectCard(e) {
      if (e.target.classList.contains("schedule-container") || 
          e.target.classList.contains("dock-slots") || 
          e.target.tagName === "TABLE" ||
          e.target.tagName === "TD") {
        selectedCardId = null;
        updateWorkbenchUI();
        renderAllCards();
      }
    }

    function updateWorkbenchUI() {
      const textInput = document.getElementById("edit-card-text");
      const colorInput = document.getElementById("edit-card-color");
      const btnDuplicate = document.getElementById("btn-duplicate");
      const btnDelete = document.getElementById("btn-delete");

      if (selectedCardId && state.cards[selectedCardId]) {
        const card = state.cards[selectedCardId];
        textInput.disabled = false;
        colorInput.disabled = false;
        btnDuplicate.disabled = false;
        btnDelete.disabled = false;

        textInput.value = card.text;
        colorInput.value = card.color;
      } else {
        textInput.disabled = true;
        colorInput.disabled = true;
        btnDuplicate.disabled = true;
        btnDelete.disabled = true;

        textInput.value = "";
        textInput.placeholder = "未選取卡帶";
        colorInput.value = "#ffffff";
      }
    }

    function handleCreateCard() {
      const textInput = document.getElementById("new-card-text");
      const colorInput = document.getElementById("new-card-color");
      const text = textInput.value.trim();

      if (!text) {
        textInput.focus();
        return;
      }

      const id = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[id] = {
        id: id,
        text: text,
        color: colorInput.value,
        slot: "dock"
      };

      textInput.value = "";
      selectCard(id);
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedText(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].text = val;
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedColor(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].color = val;
      saveToStorage();
      renderAllCards();
    }

    function handleDuplicateSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      const orig = state.cards[selectedCardId];
      const newId = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[newId] = {
        id: newId,
        text: orig.text,
        color: orig.color,
        slot: "dock"
      };
      selectCard(newId);
      saveToStorage();
      renderAllCards();
    }

    function handleDeleteSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      delete state.cards[selectedCardId];
      selectedCardId = null;
      updateWorkbenchUI();
      saveToStorage();
      renderAllCards();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "data.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.cards && imported.theme) {
            state = imported;
            selectedCardId = null;
            saveToStorage();
            applyTheme();
            updateWeekTimeline();
            updateWorkbenchUI();
          }
        } catch (err) {
          alert("SYS_ERR: INVALID ARCHIVE DATA");
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("new-card-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCreateCard();
    });

    window.onload = init;
  </script>
</body>
</html>
