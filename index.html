<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端動態日程表</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --header-bg: #313244;
      --cell-bg: #181825;
      --border-color: #45475a;
      --text-color: #cdd6f4;
      --dock-bg: #11111b;
      --active-card-border: #f5e0dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* 頂部系統設定列 */
    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.15s;
    }

    button.secondary {
      background-color: #45475a;
      color: var(--text-color);
    }

    button.danger {
      background-color: #f38ba8;
      color: #11111b;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      opacity: 0.85;
    }

    .color-picker-label {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="color"] {
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    input[type="text"] {
      background-color: #181825;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #89b4fa;
    }

    /* 日程表主顯示區 */
    .schedule-container {
      flex: 1;
      overflow: auto;
      padding: 12px;
    }

    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table th, .grid-table td {
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .grid-table th {
      background-color: var(--header-bg);
      padding: 8px 4px;
      font-size: 13px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .time-col {
      width: 65px;
      font-size: 12px;
      background-color: var(--header-bg);
    }

    .slot-cell {
      background-color: var(--cell-bg);
      height: 46px;
      vertical-align: middle;
      padding: 2px;
      transition: background-color 0.15s;
    }

    .slot-cell.drag-over {
      background-color: rgba(137, 180, 250, 0.25);
    }

    /* 下方卡帶工作台 */
    .dock-area {
      background-color: var(--dock-bg);
      border-top: 2px solid var(--border-color);
      padding: 10px 16px;
      height: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 操作控制列 */
    .workbench-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background-color: #181825;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .workbench-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workbench-divider {
      width: 1px;
      height: 22px;
      background-color: var(--border-color);
    }

    /* 底部卡帶暫存庫 */
    .dock-slots {
      flex: 1;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
      background-color: rgba(24, 24, 37, 0.5);
      border: 1px dashed var(--border-color);
    }

    /* 卡帶樣式 */
    .tape-card {
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      color: #11111b;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      width: 95%;
      margin: 0 auto;
      height: 36px;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }

    .dock-slots .tape-card {
      width: 150px;
      flex-shrink: 0;
    }

    .tape-card.selected {
      border-color: var(--active-card-border);
      box-shadow: 0 0 8px var(--active-card-border);
    }

    .tape-card:active {
      cursor: grabbing;
    }

    .tape-card span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .hint-text {
      font-size: 11px;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <!-- 頂部顏色與備份設定 -->
  <header>
    <div class="controls-group">
      <span style="font-weight: 700; font-size: 14px;">日程系統設定</span>
      <button class="secondary" onclick="exportData()">匯出備份</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">匯入備份</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)" />
    </div>

    <div class="controls-group">
      <label class="color-picker-label">背景
        <input type="color" id="picker-bg" value="#1e1e2e" onchange="updateThemeColor('--bg-color', this.value)" />
      </label>
      <label class="color-picker-label">標題欄
        <input type="color" id="picker-header" value="#313244" onchange="updateThemeColor('--header-bg', this.value)" />
      </label>
      <label class="color-picker-label">槽位底色
        <input type="color" id="picker-cell" value="#181825" onchange="updateThemeColor('--cell-bg', this.value)" />
      </label>
    </div>
  </header>

  <!-- 週間排程槽位 -->
  <div class="schedule-container" onclick="deselectCard(event)">
    <table class="grid-table">
      <thead>
        <tr>
          <th class="time-col">時間</th>
          <th>週一</th>
          <th>週二</th>
          <th>週三</th>
          <th>週四</th>
          <th>週五</th>
          <th>週六</th>
          <th>週日</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </div>

  <!-- 下方卡帶操作台與暫存庫 -->
  <div class="dock-area">
    <!-- 操作工具列 -->
    <div class="workbench-toolbar">
      <!-- 建立卡帶區塊 -->
      <div class="workbench-section">
        <input type="text" id="new-card-text" placeholder="新待辦事項名稱..." style="width: 160px;" />
        <input type="color" id="new-card-color" value="#a6e3a1" title="選擇預設顏色" />
        <button onclick="handleCreateCard()">+ 製作卡帶</button>
      </div>

      <div class="workbench-divider"></div>

      <!-- 編輯已選取卡帶區塊 -->
      <div class="workbench-section">
        <span style="font-size: 12px; font-weight: 600;">編輯選中卡帶：</span>
        <input type="text" id="edit-card-text" placeholder="點選卡帶以編輯..." style="width: 180px;" disabled oninput="handleUpdateSelectedText(this.value)" />
        <input type="color" id="edit-card-color" value="#ffffff" disabled onchange="handleUpdateSelectedColor(this.value)" />
        <button id="btn-duplicate" class="secondary" disabled onclick="handleDuplicateSelected()">複製卡帶</button>
        <button id="btn-delete" class="danger" disabled onclick="handleDeleteSelected()">刪除</button>
      </div>

      <span class="hint-text" style="margin-left: auto;">
        💡 技巧：按住 <b>Alt</b> 鍵拖曳卡帶可原地複製並投放；點擊卡帶可在操作台修改內容與顏色
      </span>
    </div>

    <!-- 底部未排程卡帶暫存庫 -->
    <div class="dock-slots" id="dock-container" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'dock')" onclick="deselectCard(event)"></div>
  </div>

  <script>
    const TIME_SLOTS = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
    const DAYS = [0, 1, 2, 3, 4, 5, 6];

    let state = {
      theme: {
        "--bg-color": "#1e1e2e",
        "--header-bg": "#313244",
        "--cell-bg": "#181825"
      },
      cards: {} // cardId: { id, text, color, slot }
    };

    let draggedCardId = null;
    let isAltCloneMode = false;
    let selectedCardId = null;

    function init() {
      loadFromStorage();
      renderGrid();
      applyTheme();
      renderAllCards();
      updateWorkbenchUI();
    }

    // LocalStorage 持久化
    function saveToStorage() {
      localStorage.setItem("schedule_hub_data_v2", JSON.stringify(state));
    }

    function loadFromStorage() {
      const saved = localStorage.getItem("schedule_hub_data_v2");
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("載入失敗", e);
        }
      }
    }

    // 主題管理
    function updateThemeColor(cssVar, color) {
      state.theme[cssVar] = color;
      applyTheme();
      saveToStorage();
    }

    function applyTheme() {
      for (const [key, val] of Object.entries(state.theme)) {
        document.documentElement.style.setProperty(key, val);
      }
      document.getElementById("picker-bg").value = state.theme["--bg-color"];
      document.getElementById("picker-header").value = state.theme["--header-bg"];
      document.getElementById("picker-cell").value = state.theme["--cell-bg"];
    }

    // 建立時間網格
    function renderGrid() {
      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      TIME_SLOTS.forEach((time, sIdx) => {
        const row = document.createElement("tr");

        const timeTd = document.createElement("td");
        timeTd.className = "time-col";
        timeTd.textContent = time;
        row.appendChild(timeTd);

        DAYS.forEach((dIdx) => {
          const td = document.createElement("td");
          td.className = "slot-cell";
          const slotId = `slot_${dIdx}_${sIdx}`;
          td.dataset.slotId = slotId;
          td.ondragover = (e) => allowDrop(e);
          td.ondragleave = (e) => e.currentTarget.classList.remove("drag-over");
          td.ondrop = (e) => handleDrop(e, slotId);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    // 卡帶 DOM 建立
    function createCardElement(card) {
      const div = document.createElement("div");
      div.className = "tape-card" + (card.id === selectedCardId ? " selected" : "");
      div.id = card.id;
      div.draggable = true;
      div.style.backgroundColor = card.color;

      // 拖曳起始判斷是否按下 Alt 鍵進行複製
      div.ondragstart = (e) => {
        draggedCardId = card.id;
        isAltCloneMode = e.altKey;
        e.dataTransfer.setData("text/plain", card.id);
      };

      // 點擊選取以啟用下方操作台
      div.onclick = (e) => {
        e.stopPropagation();
        selectCard(card.id);
      };

      const titleSpan = document.createElement("span");
      titleSpan.textContent = card.text;
      div.appendChild(titleSpan);

      return div;
    }

    function renderAllCards() {
      document.querySelectorAll(".slot-cell").forEach(cell => cell.innerHTML = "");
      document.getElementById("dock-container").innerHTML = "";

      Object.values(state.cards).forEach(card => {
        const el = createCardElement(card);
        if (card.slot === "dock" || !card.slot) {
          document.getElementById("dock-container").appendChild(el);
        } else {
          const targetSlot = document.querySelector(`[data-slot-id="${card.slot}"]`);
          if (targetSlot) {
            targetSlot.appendChild(el);
          } else {
            document.getElementById("dock-container").appendChild(el);
          }
        }
      });
    }

    // 拖曳邏輯：一般移動、對調、以及按 Alt 複製
    function allowDrop(e) {
      e.preventDefault();
      if (e.currentTarget.classList) {
        e.currentTarget.classList.add("drag-over");
      }
    }

    function handleDrop(e, targetSlotId) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");

      if (!draggedCardId || !state.cards[draggedCardId]) return;

      const sourceCard = state.cards[draggedCardId];
      const isAltPressed = e.altKey || isAltCloneMode;

      if (isAltPressed) {
        // Alt 複製模式：原地產生全新卡帶投放至目標槽位，文字原樣保留
        const newId = "card_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        
        // 若目標槽位已有卡帶，被取代的卡帶退回暫存區
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard) {
            existingCard.slot = "dock";
          }
        }

        state.cards[newId] = {
          id: newId,
          text: sourceCard.text,
          color: sourceCard.color,
          slot: targetSlotId
        };
        selectCard(newId);
      } else {
        // 一般移動模式：若目標槽位已有卡帶則互換
        const previousSlot = sourceCard.slot;

        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard && existingCard.id !== sourceCard.id) {
            existingCard.slot = previousSlot;
          }
        }

        sourceCard.slot = targetSlotId;
        selectCard(sourceCard.id);
      }

      draggedCardId = null;
      isAltCloneMode = false;

      saveToStorage();
      renderAllCards();
    }

    // 選取卡帶與操作台狀態聯動
    function selectCard(cardId) {
      selectedCardId = cardId;
      updateWorkbenchUI();
      renderAllCards();
    }

    function deselectCard(e) {
      if (e.target.classList.contains("schedule-container") || 
          e.target.classList.contains("dock-slots") || 
          e.target.tagName === "TABLE" ||
          e.target.tagName === "TD") {
        selectedCardId = null;
        updateWorkbenchUI();
        renderAllCards();
      }
    }

    function updateWorkbenchUI() {
      const textInput = document.getElementById("edit-card-text");
      const colorInput = document.getElementById("edit-card-color");
      const btnDuplicate = document.getElementById("btn-duplicate");
      const btnDelete = document.getElementById("btn-delete");

      if (selectedCardId && state.cards[selectedCardId]) {
        const card = state.cards[selectedCardId];
        textInput.disabled = false;
        colorInput.disabled = false;
        btnDuplicate.disabled = false;
        btnDelete.disabled = false;

        textInput.value = card.text;
        colorInput.value = card.color;
      } else {
        textInput.disabled = true;
        colorInput.disabled = true;
        btnDuplicate.disabled = true;
        btnDelete.disabled = true;

        textInput.value = "";
        textInput.placeholder = "點選卡帶以編輯...";
        colorInput.value = "#ffffff";
      }
    }

    // 操作台卡帶建立
    function handleCreateCard() {
      const textInput = document.getElementById("new-card-text");
      const colorInput = document.getElementById("new-card-color");
      const text = textInput.value.trim();

      if (!text) {
        textInput.focus();
        return;
      }

      const id = "card_" + Date.now();
      state.cards[id] = {
        id: id,
        text: text,
        color: colorInput.value,
        slot: "dock"
      };

      textInput.value = "";
      selectCard(id);
      saveToStorage();
      renderAllCards();
    }

    // 即時編輯選取卡帶文字與顏色
    function handleUpdateSelectedText(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].text = val;
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedColor(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].color = val;
      saveToStorage();
      renderAllCards();
    }

    // 操作台功能：複製（直接複製文字，不加副本字樣）
    function handleDuplicateSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      const original = state.cards[selectedCardId];

      const newId = "card_" + Date.now();
      state.cards[newId] = {
        id: newId,
        text: original.text,
        color: original.color,
        slot: "dock"
      };

      selectCard(newId);
      saveToStorage();
      renderAllCards();
    }

    // 操作台功能：刪除
    function handleDeleteSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      delete state.cards[selectedCardId];
      selectedCardId = null;
      updateWorkbenchUI();
      saveToStorage();
      renderAllCards();
    }

    // 匯出備份 JSON
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "schedule_backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    // 匯入備份 JSON
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.cards && imported.theme) {
            state = imported;
            selectedCardId = null;
            saveToStorage();
            applyTheme();
            renderAllCards();
            updateWorkbenchUI();
            alert("備份還原成功！");
          } else {
            alert("檔案格式不符！");
          }
        } catch (err) {
          alert("讀取檔案失敗：" + err);
        }
      };
      reader.readAsText(file);
    }

    // 按 Enter 快速新增卡帶
    document.getElementById("new-card-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCreateCard();
    });

    window.onload = init;
  </script>
</body>
</html>
