    function buildPixelMonsterSvg(monster) {
      let rects = "";
      for (let r = 0; r < monster.grid.length; r++) {
        const rowStr = monster.grid[r];
        for (let c = 0; c < rowStr.length; c++) {
          const ch = rowStr[c];
          if (ch !== "." && ch !== " " && monster.pal[ch]) {
            rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="${monster.pal[ch]}"/>`;
          }
        }
      }
      return `<svg class="monster-pixel-svg" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
    }

    /* 建立底部 BIGD MONSTER FRIENDS 風格手牌元素（含 20 種像素怪獸 + 長按拖曳至圓圈放開觸發） */
    function createSpireHandCard(card, index, totalCount) {
      const slot = document.createElement("div");
      slot.id = card.id;
      slot.draggable = true;
      slot.className = "spire-card-slot" + (card.id === selectedCardId ? " selected" : "");

      // 依卡牌 ID 穩定對應 20 種像素怪獸之一
      const numCode = parseInt(card.id.replace(/\D/g, "").slice(-4) || String(index + 1), 10);
      const monster = PIXEL_MONSTER_ROSTER[numCode % PIXEL_MONSTER_ROSTER.length];

      // 取得屬性資訊（統一使用介面純淨底色，不套用五彩顏色）
      const attrKey = card.attr && CARD_ATTRIBUTES[card.attr] ? card.attr : "study";
      const attrInfo = CARD_ATTRIBUTES[attrKey];

      // 英文翻譯副標與隨機點數
      const enSubText = card.enTitle || getFallbackEnglishSub(card.text);
      const cardPoints = typeof card.points === "number" ? card.points : ((numCode * 17) % 90) + 10;

      // 平時呈扇形弧度堆疊（左右微傾 + 弧線下沉），且約 1/3 藏於畫面底部外
      const mid = (totalCount - 1) / 2;
      const offsetFromCenter = index - mid;
      const rotDeg = Math.max(-18, Math.min(18, offsetFromCenter * 4.5));
      const arcY = Math.pow(Math.abs(offsetFromCenter), 1.65) * 4.2;
      const overlapPx = totalCount > 6 ? -40 : (totalCount > 3 ? -28 : -16);

      slot.style.setProperty("--fan-rot", `${rotDeg.toFixed(1)}deg`);
      slot.style.setProperty("--arc-y", `${arcY.toFixed(1)}px`);
      slot.style.setProperty("--overlap", `${overlapPx}px`);
      slot.style.zIndex = String(10 + index);

      const monsterSvgHtml = buildPixelMonsterSvg(monster);

      // 長按滑動手勢狀態（按住 400ms 彈出三個圓圈，拖到對應圓圈上放開才觸發）
      let pressTimer = null;
      let isRadialActive = false;
      let ignoreNextClick = false;
      let pressStartX = 0;
      let pressStartY = 0;

      const updateRadialHover = (clientX, clientY) => {
        const elUnder = document.elementFromPoint(clientX, clientY);
        const hoveredBtn = elUnder ? elUnder.closest(".radial-circle-btn") : null;
        slot.querySelectorAll(".radial-circle-btn").forEach(btn => {
          btn.classList.toggle("active-hover", btn === hoveredBtn);
        });
        return hoveredBtn;
      };

      const executeRadialAction = (action) => {
        if (action === "edit") {
          openForgePopover("edit", card.id);
        } else if (action === "duplicate") {
          duplicateCardById(card.id);
        } else if (action === "delete") {
          deleteCardById(card.id);
        }
      };

      const onGlobalMove = (clientX, clientY) => {
        if (!isRadialActive) {
          if (Math.hypot(clientX - pressStartX, clientY - pressStartY) > 6) {
            clearTimeout(pressTimer);
          }
          return;
        }
        updateRadialHover(clientX, clientY);
      };

      const onGlobalRelease = (clientX, clientY) => {
        clearTimeout(pressTimer);
        window.removeEventListener("mousemove", handleMouseMove);
        window.removeEventListener("mouseup", handleMouseUp);
        window.removeEventListener("touchmove", handleTouchMove);
        window.removeEventListener("touchend", handleTouchEnd);

        if (isRadialActive) {
          const targetBtn = updateRadialHover(clientX, clientY);
          const action = targetBtn ? targetBtn.dataset.action : null;
          isRadialActive = false;
          ignoreNextClick = true;
          closeAllRadialMenus();
          if (action) {
            executeRadialAction(action);
          }
        }
      };

      const handleMouseMove = (e) => onGlobalMove(e.clientX, e.clientY);
      const handleMouseUp = (e) => onGlobalRelease(e.clientX, e.clientY);
      const handleTouchMove = (e) => {
        if (e.touches.length === 1) {
          if (isRadialActive) e.preventDefault();
          onGlobalMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      };
      const handleTouchEnd = (e) => {
        const touch = e.changedTouches[0];
        onGlobalRelease(touch ? touch.clientX : pressStartX, touch ? touch.clientY : pressStartY);
      };

      const startPress = (x, y) => {
        isRadialActive = false;
        ignoreNextClick = false;
        pressStartX = x;
        pressStartY = y;
        clearTimeout(pressTimer);

        window.addEventListener("mousemove", handleMouseMove);
        window.addEventListener("mouseup", handleMouseUp);
        window.addEventListener("touchmove", handleTouchMove, { passive: false });
        window.addEventListener("touchend", handleTouchEnd);

        pressTimer = setTimeout(() => {
          isRadialActive = true;
          slot.draggable = false;
          closeAllRadialMenus();
          slot.classList.add("radial-open");
          updateRadialHover(x, y);
        }, 400);
      };

      slot.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        startPress(e.clientX, e.clientY);
      });

      slot.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          startPress(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      slot.ondragstart = (e) => {
        if (isRadialActive) {
          e.preventDefault();
          return;
        }
        clearTimeout(pressTimer);
        closeAllRadialMenus();
        draggedCardId = card.id;
        isAltCloneMode = e.altKey;
        e.dataTransfer.setData("text/plain", card.id);
      };

      slot.onclick = (e) => {
        e.stopPropagation();
        if (ignoreNextClick) {
          ignoreNextClick = false;
          return;
        }
        closeAllRadialMenus();
        selectCard(card.id);
      };

      slot.innerHTML = `
        <div class="card-radial-menu">
          <button class="radial-circle-btn" data-action="edit" title="修改卡牌">✎</button>
          <button class="radial-circle-btn" data-action="duplicate" title="複製卡牌">⧉</button>
          <button class="radial-circle-btn del" data-action="delete" title="刪除卡牌">✕</button>
        </div>
        <div class="spire-card-visual">
          <div class="monster-header-block">
            <div class="monster-task-title">${escapeHtml(card.text)}</div>
            <div class="monster-sub-series">${escapeHtml(enSubText)}</div>
          </div>
          <div class="monster-pixel-stage">
            ${monsterSvgHtml}
          </div>
          <div class="monster-footer-row">
            <div class="monster-logo-stamp">${attrInfo.label}</div>
            <div class="monster-points-tag">PT.${cardPoints}</div>
          </div>
        </div>
      `;

      return slot;
    }

    /* 建立手牌最右側帶有 + 號的新增卡牌槽位 */
    function createAddPlusCard(index, totalCount) {
      const slot = document.createElement("div");
      slot.className = "spire-card-slot spire-add-slot";

      const mid = (totalCount - 1) / 2;
      const offsetFromCenter = index - mid;
      const rotDeg = Math.max(-18, Math.min(18, offsetFromCenter * 4.5));
      const arcY = Math.pow(Math.abs(offsetFromCenter), 1.65) * 4.2;
      const overlapPx = totalCount > 6 ? -40 : (totalCount > 3 ? -28 : -16);

      slot.style.setProperty("--fan-rot", `${rotDeg.toFixed(1)}deg`);
      slot.style.setProperty("--arc-y", `${arcY.toFixed(1)}px`);
      slot.style.setProperty("--overlap", `${overlapPx}px`);
      slot.style.zIndex = String(10 + index);
      slot.title = "點擊添加新卡牌到手牌中";

      slot.onclick = (e) => {
        e.stopPropagation();
        openForgePopover("create");
      };

      slot.innerHTML = `
        <div class="spire-card-visual spire-add-visual">
          <div class="spire-add-plus">+</div>
          <div class="spire-add-label">ADD CARD</div>
        </div>
      `;

      return slot;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderAllCards() {
      document.querySelectorAll(".timeline-slot-dropzone, .week-slot-cell").forEach(cell => cell.innerHTML = "");
      const handContainer = document.getElementById("dock-container");
      handContainer.innerHTML = "";

      const handCards = [];
      Object.values(state.cards).forEach(card => {
        if (card.slot === "dock" || !card.slot) {
          handCards.push(card);
        } else {
          const targetSlots = document.querySelectorAll(`[data-slot-id="${card.slot}"]`);
          targetSlots.forEach(targetSlot => {
            targetSlot.appendChild(createCardElement(card));
          });
        }
      });

      // 渲染扇形手牌 + 最後一張 + 號新增卡牌
      const totalFanItems = handCards.length + 1;
      handCards.forEach((card, idx) => {
        handContainer.appendChild(createSpireHandCard(card, idx, totalFanItems));
      });
      handContainer.appendChild(createAddPlusCard(handCards.length, totalFanItems));

      // 更新 21 日軌道上所有資料夾的卡帶數量標章
      document.querySelectorAll(".day-folder").forEach(folderNode => {
        const dateKey = folderNode.dataset.dateKey;
        const badge = folderNode.querySelector(".folder-count-badge");
        if (dateKey && badge) {
          const count = Object.values(state.cards).filter(c => c.slot && c.slot.startsWith(dateKey + "_")).length;
          badge.textContent = `${count} TAPE`;
        }
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      if (e.currentTarget.classList) {
        e.currentTarget.classList.add("drag-over");
      }
    }

    function handleDrop(e, targetSlotId) {
      e.preventDefault();
      if (e.currentTarget && e.currentTarget.classList) {
        e.currentTarget.classList.remove("drag-over");
      }

      if (!draggedCardId || !state.cards[draggedCardId]) return;

      const sourceCard = state.cards[draggedCardId];
      const isAltPressed = e.altKey || isAltCloneMode;

      if (isAltPressed) {
        const newId = "CRYO_" + Date.now().toString().slice(-6);
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard) existingCard.slot = "dock";
        }
        state.cards[newId] = {
          id: newId,
          text: sourceCard.text,
          color: sourceCard.color,
          slot: targetSlotId
        };
        selectCard(newId);
      } else {
        const previousSlot = sourceCard.slot;
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard && existingCard.id !== sourceCard.id) {
            existingCard.slot = previousSlot;
          }
        }
        sourceCard.slot = targetSlotId;
        selectCard(sourceCard.id);
      }

      draggedCardId = null;
      isAltCloneMode = false;
      saveToStorage();
      renderAllCards();
    }

    function selectCard(cardId) {
      selectedCardId = cardId;
      renderAllCards();
    }

    function deselectCard(e) {
      if (chainHasMoved) return;
      if (e.target.classList.contains("schedule-container") || 
          e.target.classList.contains("folder-wave-stage") ||
          e.target.classList.contains("folder-wave-row") ||
          e.target.classList.contains("drawer-scroll-area") ||
          e.target.classList.contains("timeline-slot-dropzone") ||
          e.target.classList.contains("week-slot-cell")) {
        selectedCardId = null;
        closeForgePopover();
        renderAllCards();
      }
    }

    /* ========================================================
       + 號卡牌新增與編輯迷你視窗控制
       ======================================================== */
    let forgeMode = "create";
    let forgeEditingId = null;
    let forgeSelectedAttr = "study";

    function renderAttrDropdownMenu() {
      const menu = document.getElementById("forge-custom-menu");
      if (!menu) return;
      menu.innerHTML = "";
      const entries = Object.entries(CARD_ATTRIBUTES);
      const total = entries.length;
      entries.forEach(([key, info], idx) => {
        const item = document.createElement("div");
        item.className = "forge-menu-item" + (key === forgeSelectedAttr ? " active" : "");
        // 越靠近底部的項目延遲越短（0ms），依序從下往上一個接一個彈出
        const bottomUpIndex = total - 1 - idx;
        item.style.setProperty("--stagger-idx", String(bottomUpIndex));
        item.textContent = info.label;
        item.onclick = (e) => {
          e.stopPropagation();
          selectAttrOption(key);
          closeAttrDropdown();
        };
        menu.appendChild(item);
      });
    }

    function toggleAttrDropdown(e) {
      e.stopPropagation();
      const wrap = document.getElementById("forge-attr-dropdown");
      if (!wrap) return;
      const willOpen = !wrap.classList.contains("open");
      if (willOpen) {
        renderAttrDropdownMenu();
        wrap.classList.add("open");
      } else {
        wrap.classList.remove("open");
      }
    }

    function closeAttrDropdown() {
      const wrap = document.getElementById("forge-attr-dropdown");
      if (wrap) wrap.classList.remove("open");
    }

    function selectAttrOption(attrKey) {
      const labelEl = document.getElementById("forge-attr-label");
      if (CARD_ATTRIBUTES[attrKey]) {
        forgeSelectedAttr = attrKey;
        if (labelEl) labelEl.textContent = CARD_ATTRIBUTES[attrKey].label;
      }
    }

    function openForgePopover(mode = "create", cardId = null) {
      forgeMode = mode;
      forgeEditingId = cardId;
      const popover = document.getElementById("spire-forge-popover");
      const textInput = document.getElementById("forge-card-text");

      if (mode === "edit" && cardId && state.cards[cardId]) {
        const card = state.cards[cardId];
        const attrKey = card.attr && CARD_ATTRIBUTES[card.attr] ? card.attr : "study";
        textInput.value = card.text;
        selectAttrOption(attrKey);
      } else {
        textInput.value = "";
        selectAttrOption("study");
      }

      closeAttrDropdown();
      popover.classList.add("active");
      setTimeout(() => textInput.focus(), 20);
    }

    function closeForgePopover() {
      closeAttrDropdown();
      const popover = document.getElementById("spire-forge-popover");
      if (popover) popover.classList.remove("active");
    }

    function submitForgeCard() {
      const textInput = document.getElementById("forge-card-text");
      const text = textInput.value.trim();

      if (!text) {
        textInput.focus();
        return;
      }

      const selectedAttr = forgeSelectedAttr || "study";
      const fallbackEn = getFallbackEnglishSub(text);

      if (forgeMode === "edit" && forgeEditingId && state.cards[forgeEditingId]) {
        const oldText = state.cards[forgeEditingId].text;
        state.cards[forgeEditingId].text = text;
        state.cards[forgeEditingId].attr = selectedAttr;
        state.cards[forgeEditingId].color = "#ffffff";
        if (typeof state.cards[forgeEditingId].points !== "number") {
          state.cards[forgeEditingId].points = Math.floor(Math.random() * 90) + 10;
        }
        if (oldText !== text || !state.cards[forgeEditingId].enTitle) {
          state.cards[forgeEditingId].enTitle = fallbackEn;
          autoTranslateCardTitle(forgeEditingId, text);
        }
        selectCard(forgeEditingId);
      } else {
        const id = "CRYO_" + Date.now().toString().slice(-6);
        const randomPoints = Math.floor(Math.random() * 90) + 10;
        state.cards[id] = {
          id: id,
          text: text,
          enTitle: fallbackEn,
          attr: selectedAttr,
          points: randomPoints,
          color: "#ffffff",
          slot: "dock"
        };
        autoTranslateCardTitle(id, text);
        selectCard(id);
      }

      closeForgePopover();
      saveToStorage();
      renderAllCards();
    }

    function duplicateCardById(cardId) {
      const orig = state.cards[cardId];
      if (!orig) return;
      const newId = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[newId] = {
        id: newId,
        text: orig.text,
        enTitle: orig.enTitle || getFallbackEnglishSub(orig.text),
        attr: orig.attr || "study",
        points: Math.floor(Math.random() * 90) + 10,
        color: orig.color,
        slot: "dock"
      };
      selectCard(newId);
      saveToStorage();
      renderAllCards();
    }

    function deleteCardById(cardId) {
      if (!state.cards[cardId]) return;
      delete state.cards[cardId];
      if (selectedCardId === cardId) selectedCardId = null;
      saveToStorage();
      renderFolderWave();
      renderAllCards();
    }

    document.getElementById("forge-card-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitForgeCard();
      if (e.key === "Escape") closeForgePopover();
    });

    window.onload = init;
  </script>
