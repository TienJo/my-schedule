<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRYO ARCHIVE // SCHEDULE MATRIX</title>

  <!-- Google API SDK (供 Google Drive 雲端同步使用) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- 引入等寬英數輔助字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Cinzel:wght@700;900&family=EB+Garamond:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    /* 讀取同目錄下的 Celtic Garamond the 2nd 字型檔 */
    @font-face {
      font-family: 'Celtic Garamond the 2nd';
      src: url('./CelticGaramondthe2nd.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 全局 CSS 變數：支援四大系統顏色連動（含藍白棋盤方格主色與次色） */
    :root {
      --bg-color: #002be8;       /* 藍色系：棋盤主格色、槽位底色、次要按鈕底色 */
      --grid-alt-color: #ffffff; /* 方格次色：棋盤交錯格色（預設白色，可於齒輪設定調整） */
      --header-bg: #000000;      /* 黑色系：標題列、導覽列、表頭、底板 */
      --accent-color: #e2ff00;   /* 螢光黃系：大標題、TODAY按鈕、時間文字、選取光暈 */
      --text-color: #ffffff;
      
      --font-ui: "Space Mono", "Consolas", "Courier New", monospace;
      --font-card: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      font-family: var(--font-ui);
      /* 60px x 60px 純正方形藍白相間棋盤格（無斜向三角形接縫） */
      background-image:
        repeating-conic-gradient(
          var(--grid-alt-color) 0% 25%,
          transparent 0% 50%
        );
      background-size: 120px 120px;
      background-position: 0px 0px;
      animation: infiniteGridMove 12s linear infinite;
    }

    @keyframes infiniteGridMove {
      0% {
        background-position: 0px 0px;
      }
      100% {
        background-position: 120px -120px;
      }
    }

    /* 頂部列 */
    header {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--header-bg);
      padding: 6px 14px 4px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 30;
    }

    /* 大標題：專用 Celtic Garamond the 2nd 字型 (帶有古典/凱爾特襯線字型備援) */
    .hero-period-display {
      font-family: 'Celtic Garamond the 2nd', 'CelticGaramondthe2nd', 'EB Garamond', 'Cinzel', 'Garamond', serif !important;
      font-size: 27px;
      font-weight: normal;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 4px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 3px var(--accent-color);
    }

    .hero-period-display span,
    .hero-period-display .slash {
      font-family: 'Celtic Garamond the 2nd', 'CelticGaramondthe2nd', 'EB Garamond', 'Cinzel', 'Garamond', serif !important;
    }

    .hero-period-display .slash {
      color: var(--accent-color);
      margin: 0 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      font-family: var(--font-ui);
      background-color: #ffffff;
      color: var(--header-bg);
      border: 2px solid var(--header-bg);
      padding: 3px 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button.accent {
      background-color: var(--accent-color);
      border-color: var(--header-bg);
      color: var(--header-bg);
    }

    button.secondary {
      background-color: var(--bg-color);
      border-color: #ffffff;
      color: #ffffff;
    }

    button.danger {
      background-color: #ff3344;
      border-color: var(--header-bg);
      color: #ffffff;
    }

    button.icon-btn {
      padding: 3px 7px;
      font-size: 13px;
      line-height: 1;
    }

    button:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px var(--header-bg);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 齒輪自訂選單彈窗 */
    .settings-modal {
      position: absolute;
      top: 48px;
      right: 14px;
      background: var(--header-bg);
      border: 2px solid #ffffff;
      box-shadow: 4px 4px 0px var(--header-bg);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      min-width: 300px;
      max-width: 360px;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .color-picker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .google-sync-section {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .google-sync-section label {
      font-size: 10px;
      color: var(--accent-color);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .google-sync-section input[type="text"] {
      width: 100%;
      font-size: 10px;
      padding: 4px 6px;
    }

    input[type="color"] {
      border: 1px solid #ffffff;
      width: 24px;
      height: 24px;
      cursor: pointer;
      background: none;
    }

    /* 週次巡航列 */
    .calendar-nav-bar {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--header-bg);
      padding: 4px 14px 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 25;
    }

    .nav-section {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lock-status {
      font-family: var(--font-ui);
      font-size: 10px;
      color: #777777;
      letter-spacing: 1px;
      font-weight: 700;
      transition: color 0.2s;
    }

    .lock-status.linked {
      color: var(--accent-color);
    }

    /* 主工作區：包含漂浮資料夾波動列與向下展開的時間表 */
    .schedule-container {
      flex: 1;
      overflow: hidden;
      padding: 10px 14px 12px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 7 日漂浮資料夾波動帶容器（預設在 Y 軸中央，點選後平滑向上推升） */
    .folder-wave-stage {
      position: relative;
      width: 100%;
      padding: 14px 6px 10px 6px;
      flex-shrink: 0;
      z-index: 15;
      transform: translateY(0);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), padding 0.45s ease;
    }

    /* 7 日波動串聯背景線 (SVG) */
    .wave-connector-svg {
      position: absolute;
      top: 52%;
      left: 3%;
      width: 94%;
      height: 70px;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .wave-path-glow {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      opacity: 0.75;
      animation: waveFlow 14s linear infinite;
    }

    .wave-path-base {
      fill: none;
      stroke: var(--header-bg);
      stroke-width: 2;
      opacity: 0.5;
    }

    @keyframes waveFlow {
      to {
        stroke-dashoffset: -280;
      }
    }

    /* 7 個資料夾橫向波浪排列 */
    .folder-wave-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      position: relative;
      z-index: 2;
      align-items: center;
    }

    /* 漂浮動態 (上下懸浮波浪) */
    @keyframes folderFloat {
      0%, 100% {
        transform: translateY(var(--base-y, 0px));
      }
      50% {
        transform: translateY(calc(var(--base-y, 0px) - 9px));
      }
    }

    /* 單一日期資料夾本體 */
    .day-folder {
      position: relative;
      background-color: var(--header-bg);
      border: 2px solid #ffffff;
      box-shadow: 4px 4px 0px var(--header-bg);
      padding: 11px 10px 9px 10px;
      margin-top: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 76px;
      animation: folderFloat 3.4s ease-in-out infinite;
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, min-height 0.4s ease, padding 0.4s ease;
    }

    /* 展開狀態下，資料夾稍微緊湊以留出更多時間表空間 */
    .schedule-container.is-expanded .day-folder {
      min-height: 62px;
      padding: 8px 9px 7px 9px;
      margin-top: 10px;
    }

    /* 資料夾左上角折角標籤 */
    .day-folder::before {
      content: attr(data-tab);
      position: absolute;
      top: -13px;
      left: -2px;
      height: 13px;
      padding: 0 8px;
      background-color: var(--header-bg);
      border: 2px solid #ffffff;
      border-bottom: none;
      font-size: 8.5px;
      line-height: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    /* 懸停效果 */
    .day-folder:hover {
      border-color: var(--accent-color);
      box-shadow: 0 0 12px rgba(226, 255, 0, 0.45), 4px 4px 0px var(--header-bg);
    }

    .day-folder:hover::before {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* 今日資料夾標記 */
    .day-folder.is-today {
      border-color: var(--accent-color);
    }

    .day-folder.is-today::before {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: var(--header-bg);
    }

    /* 點選展開中的資料夾（停止漂浮並凸顯亮起） */
    .day-folder.active {
      animation-play-state: paused;
      transform: translateY(-4px) !important;
      background-color: var(--accent-color);
      border-color: #ffffff;
      color: var(--header-bg);
      box-shadow: 0 0 18px var(--accent-color), 4px 4px 0px var(--header-bg);
    }

    .day-folder.active::before {
      background-color: #ffffff;
      border-color: #ffffff;
      color: var(--header-bg);
    }

    /* 拖曳卡帶經過資料夾時的接收高亮 */
    .day-folder.drag-over {
      background-color: var(--accent-color) !important;
      color: var(--header-bg) !important;
      border-color: #ffffff !important;
      transform: scale(1.04) !important;
    }

    .folder-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .folder-date-num {
      font-size: 16px;
      font-weight: 700;
      margin: 2px 0;
      letter-spacing: 0.5px;
    }

    .schedule-container.is-expanded .folder-date-num {
      font-size: 14px;
      margin: 1px 0;
    }

    .folder-bottom-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      opacity: 0.85;
      border-top: 1px dashed rgba(255, 255, 255, 0.25);
      padding-top: 4px;
      margin-top: 2px;
    }

    .day-folder.active .folder-bottom-line {
      border-top-color: rgba(0, 0, 0, 0.3);
    }

    .folder-count-badge {
      background-color: var(--bg-color);
      color: #ffffff;
      padding: 1px 5px;
      font-size: 9px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .day-folder.active .folder-count-badge {
      background-color: var(--header-bg);
      color: var(--accent-color);
      border-color: var(--header-bg);
    }

    /* 向下展開的單日時間表抽屜（未展開時高度為 0，點開後平滑長出並把上方資料夾推升至頂部） */
    .day-drawer-wrapper {
      flex: 0 0 0px;
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      margin-top: 0px;
      background-color: var(--header-bg);
      border: 0px solid #ffffff;
      box-shadow: 4px 4px 0px var(--header-bg);
      display: flex;
      flex-direction: column;
      transform: translateY(-10px);
      transition:
        flex-grow 0.52s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.52s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        margin-top 0.45s ease;
    }

    .day-drawer-wrapper.open {
      flex: 1 1 auto;
      max-height: 900px;
      opacity: 1;
      margin-top: 6px;
      border-width: 2px;
      transform: translateY(0);
    }

    .drawer-header-bar {
      background-color: var(--header-bg);
      border-bottom: 2px solid #ffffff;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .drawer-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .drawer-scroll-area {
      flex: 1;
      overflow-y: auto;
      background-color: var(--bg-color);
    }

    /* 展開後的單日時間軸列表 */
    .day-timeline-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .timeline-row {
      display: flex;
      align-items: stretch;
      min-height: 44px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      transition: background-color 0.12s;
    }

    .timeline-row:last-child {
      border-bottom: none;
    }

    .timeline-time-label {
      width: 86px;
      min-width: 86px;
      background-color: var(--header-bg);
      color: var(--accent-color);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #ffffff;
      letter-spacing: 0.6px;
    }

    .timeline-slot-dropzone {
      flex: 1;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      background-color: var(--bg-color);
      position: relative;
      transition: background-color 0.12s;
    }

    .timeline-slot-dropzone:empty::after {
      content: "— AVAILABLE TIME BLOCK (DROP CARTRIDGE HERE) —";
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 1px;
      pointer-events: none;
    }

    .timeline-slot-dropzone.drag-over {
      background-color: var(--accent-color) !important;
      outline: 2px dashed var(--header-bg);
    }

    .timeline-slot-dropzone .tape-card {
      width: 100%;
      max-width: 560px;
      margin: 0;
    }

    /* 下方卡帶操作台 */
    .dock-area {
      background-color: var(--header-bg);
      border-top: 3px solid #ffffff;
      padding: 8px 14px;
      height: 190px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      box-shadow: 0px -4px 12px rgba(0,0,0,0.6);
    }

    .workbench-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .workbench-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .workbench-divider {
      width: 2px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dock-slots {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      padding: 6px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .tape-card {
      background-color: #ffffff;
      color: var(--header-bg);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 96%;
      margin: 0 auto;
      height: 36px;
      padding: 0 10px;
      border: 2px solid var(--header-bg);
      box-shadow: 2px 2px 0px var(--header-bg);
      position: relative;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .tape-card::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 3px;
      background: var(--header-bg);
      opacity: 0.35;
    }

    /* 過期卡帶自動消隱（變 CELL 色） */
    .tape-card.passed-card {
      background-color: var(--bg-color) !important;
      color: rgba(255, 255, 255, 0.45) !important;
      border-color: var(--header-bg) !important;
      box-shadow: 1px 1px 0px var(--header-bg);
    }

    .tape-card.passed-card::before {
      background: var(--header-bg);
      opacity: 0.2;
    }

    .tape-card.passed-card span {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .tape-card.passed-card .card-meta-code {
      color: rgba(255, 255, 255, 0.35) !important;
    }

    .dock-slots .tape-card {
      width: 170px;
      flex-shrink: 0;
    }

    .tape-card.selected {
      border: 2px solid var(--accent-color) !important;
      box-shadow: 0 0 10px var(--accent-color), 2px 2px 0px var(--header-bg) !important;
    }

    .tape-card:active {
      cursor: grabbing;
      transform: translate(1px, 1px);
    }

    .tape-card span {
      font-family: var(--font-card);
      font-size: 11px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      padding-left: 4px;
      letter-spacing: 0.5px;
    }

    .card-meta-code {
      font-family: var(--font-ui);
      font-size: 8.5px;
      opacity: 0.45;
      pointer-events: none;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      font-family: var(--font-card);
      background-color: var(--header-bg);
      color: var(--accent-color);
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .hint-text {
      font-family: var(--font-ui);
      font-size: 10px;
      color: #777777;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    /* 系統狀態通知條 (取代原生 alert) */
    .system-toast {
      position: fixed;
      bottom: 202px;
      right: 14px;
      background-color: var(--header-bg);
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      box-shadow: 4px 4px 0px var(--header-bg);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .system-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header>
    <div class="hero-period-display" id="period-display">
      <span>2026</span><span class="slash">//</span><span>MONTH 09</span><span class="slash">//</span><span>WEEK 03</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSettingsModal(event)" title="COLOR & SYNC CONFIG">⚙</button>
    </div>

    <!-- 齒輪設定彈窗 -->
    <div class="settings-modal" id="settings-modal" onclick="event.stopPropagation()">
      <div class="settings-header">
        <span>SYSTEM CONFIG</span>
        <span style="cursor: pointer;" onclick="toggleSettingsModal(event)">✕</span>
      </div>
      
      <div class="color-picker-row">
        <span>棋盤主格 / 槽位底色</span>
        <input type="color" id="picker-bg" value="#002be8" onchange="updateThemeColor('--bg-color', this.value)" />
      </div>
      <div class="color-picker-row">
        <span>棋盤交錯格色 (GRID ALT)</span>
        <input type="color" id="picker-grid-alt" value="#ffffff" onchange="updateThemeColor('--grid-alt-color', this.value)" />
      </div>
      <div class="color-picker-row">
        <span>黑色系統 (PANEL / BAR)</span>
        <input type="color" id="picker-header" value="#000000" onchange="updateThemeColor('--header-bg', this.value)" />
      </div>
      <div class="color-picker-row">
        <span>螢光黃系統 (HERO / FOCUS)</span>
        <input type="color" id="picker-accent" value="#e2ff00" onchange="updateThemeColor('--accent-color', this.value)" />
      </div>

      <!-- Google 雲端硬碟自動同步面板 -->
      <div class="google-sync-section">
        <label>
          <span>GOOGLE DRIVE SYNC</span>
          <span id="auto-login-badge" style="color: #888; font-size: 9px;">AUTO-LOGIN: OFF</span>
        </label>
        <input type="text" id="google-client-id" placeholder="OAuth Client ID..." onchange="handleSaveClientId(this.value)" />
        <div style="display: flex; gap: 4px; margin-top: 4px;">
          <button id="btn-gdrive-auth" class="accent" style="flex: 2;" onclick="handleAuthGoogleDrive()">登入 GOOGLE</button>
          <button id="btn-gdrive-sync" class="secondary" style="flex: 1;" disabled onclick="syncFromGoogleDrive()">同步</button>
          <button id="btn-gdrive-logout" class="danger" style="flex: 1; display: none;" onclick="handleLogoutGoogleDrive()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 週次導覽列 -->
  <div class="calendar-nav-bar">
    <div class="nav-section">
      <button class="secondary" onclick="navigateMonth(-1)">◀ PREV MONTH</button>
      <button class="secondary" onclick="navigateWeek(-1)">◀ PREV WEEK</button>
      <button class="accent" onclick="jumpToCurrentDate()">TODAY</button>
      <button class="secondary" onclick="navigateWeek(1)">NEXT WEEK ▶</button>
      <button class="secondary" onclick="navigateMonth(1)">NEXT MONTH ▶</button>
    </div>

    <div class="lock-status" id="sync-status">
      [SYNC: LOCAL DATA PERSISTED]
    </div>
  </div>

  <!-- 漂浮資料夾波動帶 + 向下展開單日日程容器 -->
  <div class="schedule-container" id="schedule-container" onclick="deselectCard(event)">
    <!-- 7 日波動漂浮資料夾列（預設在 Y 軸中央，點選後平滑向上推升至頂部） -->
    <div class="folder-wave-stage" id="folder-wave-stage">
      <svg class="wave-connector-svg" viewBox="0 0 1000 70" preserveAspectRatio="none">
        <path class="wave-path-base" d="M 30 35 Q 110 8, 190 35 T 350 35 T 510 35 T 670 35 T 830 35 T 970 35" />
        <path class="wave-path-glow" d="M 30 35 Q 110 8, 190 35 T 350 35 T 510 35 T 670 35 T 830 35 T 970 35" />
      </svg>
      <div class="folder-wave-row" id="folder-wave-row"></div>
    </div>

    <!-- 點選資料夾後向下展開的時間表抽屜 -->
    <div class="day-drawer-wrapper" id="day-drawer-wrapper">
      <div class="drawer-header-bar">
        <div class="drawer-title" id="drawer-title">
          <span>SELECT A FOLDER ABOVE</span>
        </div>
        <button class="secondary" onclick="closeDayDrawer(event)">▲ 收合至中央</button>
      </div>
      <div class="drawer-scroll-area" id="drawer-scroll-area">
        <div class="day-timeline-list" id="day-timeline-list"></div>
      </div>
    </div>
  </div>

  <!-- 無干擾系統通知氣泡 -->
  <div class="system-toast" id="system-toast"></div>

  <!-- 下方卡帶操作台 -->
  <div class="dock-area">
    <div class="workbench-toolbar">
      <div class="workbench-section">
        <input type="text" id="new-card-text" placeholder="輸入待辦事項..." style="width: 170px;" />
        <input type="color" id="new-card-color" value="#ffffff" title="CARTRIDGE COLOR" />
        <button class="accent" onclick="handleCreateCard()">+ 製作卡帶</button>
      </div>

      <div class="workbench-divider"></div>

      <div class="workbench-section">
        <span style="font-size: 10px; font-weight: 700; color: #888;">TARGET CONFIG:</span>
        <input type="text" id="edit-card-text" placeholder="未選取卡帶" style="width: 170px;" disabled oninput="handleUpdateSelectedText(this.value)" />
        <input type="color" id="edit-card-color" value="#ffffff" disabled onchange="handleUpdateSelectedColor(this.value)" />
        <button id="btn-duplicate" class="secondary" disabled onclick="handleDuplicateSelected()">複製</button>
        <button id="btn-delete" class="danger" disabled onclick="handleDeleteSelected()">刪除</button>
      </div>

      <span class="hint-text" style="margin-left: auto;">
        [ALT + 拖曳]: 快速複製投放 / 點擊卡帶在下方操作台編輯
      </span>
    </div>

    <div class="dock-slots" id="dock-container" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'dock')" onclick="deselectCard(event)"></div>
  </div>

  <script>
    const TIME_SLOTS = [
      "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", 
      "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", 
      "19:00", "20:00", "21:00", "22:00", "23:00"
    ];
    const DAY_NAMES = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    // 預設 Client ID
    const DEFAULT_GOOGLE_CLIENT_ID = "865993916714-o0h883itsqd3lvgbatmkgqrqqhbrmuhf.apps.googleusercontent.com";

    // 儲存登入狀態的 Key
    const STORAGE_KEYS = {
      CLIENT_ID: "gdrive_sync_client_id",
      ACCESS_TOKEN: "gdrive_access_token",
      TOKEN_EXPIRY: "gdrive_token_expiry",
      AUTO_LOGIN: "gdrive_auto_login_enabled"
    };

    let state = {
      theme: {
        "--bg-color": "#002be8",
        "--grid-alt-color": "#ffffff",
        "--header-bg": "#000000",
        "--accent-color": "#e2ff00"
      },
      cards: {}
    };

    let currentAnchorDate = new Date();
    let displayedWeekDates = [];
    let expandedDateKey = null; // 初始為 null：所有資料夾在畫面 Y 軸正中央懸浮待命

    let draggedCardId = null;
    let isAltCloneMode = false;
    let selectedCardId = null;

    // Google API 授權與同步狀態
    const GDRIVE_FILE_NAME = "cryo_schedule_data.json";
    const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
    let tokenClient = null;
    let googleAccessToken = null;
    let gdriveFileId = null;
    let cloudDebounceTimer = null;
    let tokenRefreshTimer = null;
    let toastTimer = null;

    function showToast(msg) {
      const toast = document.getElementById("system-toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function init() {
      loadFromStorage();
      applyTheme();
      updateWeekTimeline();
      updateWorkbenchUI();
      initGoogleAuthSettings();

      document.addEventListener("click", () => {
        const modal = document.getElementById("settings-modal");
        if (modal) modal.classList.remove("active");
      });

      // 每分鐘自動檢視時間，過期卡帶即時變為 CELL 底色
      setInterval(() => {
        renderAllCards();
      }, 60000);
    }

    /* ========================================================
       GOOGLE 雲端儲存 (DRIVE APPDATA) 持久化自動登入與同步引擎
       ======================================================== */
    function initGoogleAuthSettings() {
      const savedClientId = localStorage.getItem(STORAGE_KEYS.CLIENT_ID) || DEFAULT_GOOGLE_CLIENT_ID;
      const input = document.getElementById("google-client-id");
      if (input) input.value = savedClientId;

      const isAutoLoginEnabled = localStorage.getItem(STORAGE_KEYS.AUTO_LOGIN) === "true";
      const savedToken = localStorage.getItem(STORAGE_KEYS.ACCESS_TOKEN);
      const savedExpiry = parseInt(localStorage.getItem(STORAGE_KEYS.TOKEN_EXPIRY) || "0", 10);

      // 1. 檢查是否還有未過期的有效 Token（保留 2 分鐘緩衝時間）
      if (isAutoLoginEnabled && savedToken && Date.now() < savedExpiry - 120000) {
        googleAccessToken = savedToken;
        updateGoogleConnectedUI(true);
        scheduleTokenRefresh(savedExpiry - Date.now());
        // 直接從雲端同步最新資料，完全不需重新登入
        syncFromGoogleDrive();
        setupTokenClient(savedClientId, false);
      } else {
        // 2. 若 Token 已過期，但使用者曾經登入過，載入 SDK 後自動進行靜默無感續期
        setupTokenClient(savedClientId, isAutoLoginEnabled);
      }
    }

    function updateGoogleConnectedUI(connected) {
      const authBtn = document.getElementById("btn-gdrive-auth");
      const syncBtn = document.getElementById("btn-gdrive-sync");
      const logoutBtn = document.getElementById("btn-gdrive-logout");
      const statusEl = document.getElementById("sync-status");
      const badgeEl = document.getElementById("auto-login-badge");

      if (connected) {
        authBtn.textContent = "已連結 GOOGLE";
        syncBtn.disabled = false;
        logoutBtn.style.display = "inline-block";
        statusEl.textContent = "[SYNC: GOOGLE DRIVE LINKED]";
        statusEl.classList.add("linked");
        if (badgeEl) {
          badgeEl.textContent = "AUTO-LOGIN: ON";
          badgeEl.style.color = "var(--accent-color)";
        }
      } else {
        authBtn.textContent = "登入 GOOGLE";
        syncBtn.disabled = true;
        logoutBtn.style.display = "none";
        statusEl.textContent = "[SYNC: LOCAL DATA PERSISTED]";
        statusEl.classList.remove("linked");
        if (badgeEl) {
          badgeEl.textContent = "AUTO-LOGIN: OFF";
          badgeEl.style.color = "#888";
        }
      }
    }

    function scheduleTokenRefresh(msUntilExpiry) {
      clearTimeout(tokenRefreshTimer);
      // 在過期前 3 分鐘自動背景換發新 Token
      const refreshDelay = Math.max(msUntilExpiry - 180000, 10000);
      tokenRefreshTimer = setTimeout(() => {
        if (localStorage.getItem(STORAGE_KEYS.AUTO_LOGIN) === "true" && tokenClient) {
          tokenClient.requestAccessToken({ prompt: "none" });
        }
      }, refreshDelay);
    }

    function handleSaveClientId(val) {
      const clientId = val.trim() || DEFAULT_GOOGLE_CLIENT_ID;
      localStorage.setItem(STORAGE_KEYS.CLIENT_ID, clientId);
      setupTokenClient(clientId, false);
      showToast("GOOGLE CLIENT ID 已儲存！");
    }

    function setupTokenClient(clientId, attemptSilentLogin = false) {
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        // 若 SDK 尚未下載完成，延遲 250ms 再重試
        setTimeout(() => setupTokenClient(clientId, attemptSilentLogin), 250);
        return;
      }
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: GDRIVE_SCOPE,
          callback: async (resp) => {
            if (resp.error) {
              console.error("GOOGLE AUTH FAILED", resp);
              showToast("授權失敗：" + resp.error);
              return;
            }

            // 成功取得通行證，寫入 localStorage 實現永久記住登入
            googleAccessToken = resp.access_token;
            const expiresInSec = resp.expires_in ? parseInt(resp.expires_in, 10) : 3599;
            const expiryTimestamp = Date.now() + expiresInSec * 1000;

            localStorage.setItem(STORAGE_KEYS.ACCESS_TOKEN, googleAccessToken);
            localStorage.setItem(STORAGE_KEYS.TOKEN_EXPIRY, String(expiryTimestamp));
            localStorage.setItem(STORAGE_KEYS.AUTO_LOGIN, "true");

            updateGoogleConnectedUI(true);
            scheduleTokenRefresh(expiresInSec * 1000);
            await syncFromGoogleDrive();
          }
        });

        // 若之前已登入過且 Token 已過期，自動在背景靜默續期（無需彈窗）
        if (attemptSilentLogin && !googleAccessToken) {
          document.getElementById("sync-status").textContent = "[SYNC: AUTO-SIGNING IN...]";
          tokenClient.requestAccessToken({ prompt: "none" });
        }
      } catch (e) {
        console.error("TokenClient init error:", e);
      }
    }

    function handleAuthGoogleDrive() {
      const clientId = (document.getElementById("google-client-id").value || DEFAULT_GOOGLE_CLIENT_ID).trim();
      if (!tokenClient) setupTokenClient(clientId, false);
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: "" });
      } else {
        showToast("Google 認證庫載入中，請稍候兩秒再點一次！");
      }
    }

    function handleLogoutGoogleDrive() {
      if (googleAccessToken && window.google && google.accounts && google.accounts.oauth2) {
        google.accounts.oauth2.revoke(googleAccessToken, () => {});
      }
      googleAccessToken = null;
      gdriveFileId = null;
      clearTimeout(tokenRefreshTimer);
      localStorage.removeItem(STORAGE_KEYS.ACCESS_TOKEN);
      localStorage.removeItem(STORAGE_KEYS.TOKEN_EXPIRY);
      localStorage.setItem(STORAGE_KEYS.AUTO_LOGIN, "false");
      updateGoogleConnectedUI(false);
      showToast("已登出 GOOGLE 雲端同步");
    }

    async function syncFromGoogleDrive() {
      if (!googleAccessToken) return;
      document.getElementById("sync-status").textContent = "[SYNC: FETCHING FROM CLOUD...]";

      try {
        const query = encodeURIComponent(`name = '${GDRIVE_FILE_NAME}' and trashed = false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&fields=files(id,name)`, {
          headers: { Authorization: `Bearer ${googleAccessToken}` }
        });

        if (listRes.status === 401) {
          googleAccessToken = null;
          localStorage.removeItem(STORAGE_KEYS.ACCESS_TOKEN);
          if (tokenClient) tokenClient.requestAccessToken({ prompt: "none" });
          return;
        }

        const listData = await listRes.json();

        if (listData.files && listData.files.length > 0) {
          gdriveFileId = listData.files[0].id;
          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${gdriveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${googleAccessToken}` }
          });
          const cloudState = await fileRes.json();

          if (cloudState && cloudState.cards) {
            state = cloudState;
            if (!state.theme["--grid-alt-color"]) {
              state.theme["--grid-alt-color"] = "#ffffff";
            }
            saveToStorage(false);
            applyTheme();
            renderFolderWave();
            renderExpandedDrawer();
            renderAllCards();
            document.getElementById("sync-status").textContent = "[SYNC: CLOUD SYNCED]";
            return;
          }
        } else {
          await saveToGoogleDrive();
        }
      } catch (err) {
        console.error("CLOUD SYNC ERROR", err);
        document.getElementById("sync-status").textContent = "[SYNC: CLOUD ERROR]";
      }
    }

    async function saveToGoogleDrive() {
      if (!googleAccessToken) return;

      const fileContent = JSON.stringify(state, null, 2);
      const boundary = "-------314159265358979323846";
      const delimiter = "\r\n--" + boundary + "\r\n";
      const closeDelim = "\r\n--" + boundary + "--";

      try {
        if (!gdriveFileId) {
          const metadata = {
            name: GDRIVE_FILE_NAME,
            parents: ["appDataFolder"]
          };
          const multipartRequestBody =
            delimiter +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            JSON.stringify(metadata) +
            delimiter +
            'Content-Type: application/json\r\n\r\n' +
            fileContent +
            closeDelim;

          const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${googleAccessToken}`,
              "Content-Type": `multipart/related; boundary=${boundary}`
            },
            body: multipartRequestBody
          });

          if (res.status === 401 && tokenClient) {
            tokenClient.requestAccessToken({ prompt: "none" });
            return;
          }

          const data = await res.json();
          if (data.id) gdriveFileId = data.id;
        } else {
          const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gdriveFileId}?uploadType=media`, {
            method: "PATCH",
            headers: {
              Authorization: `Bearer ${googleAccessToken}`,
              "Content-Type": "application/json"
            },
            body: fileContent
          });

          if (res.status === 401 && tokenClient) {
            tokenClient.requestAccessToken({ prompt: "none" });
            return;
          }
        }
        document.getElementById("sync-status").textContent = "[SYNC: GOOGLE DRIVE SAVED]";
      } catch (err) {
        console.error("GDRIVE SAVE ERROR", err);
      }
    }

    /* ========================================================
       本機持久化儲存與防抖雲端連動
       ======================================================== */
    function loadFromStorage() {
      const saved = localStorage.getItem("schedule_cryo_matrix_clean");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = parsed;
          if (!state.theme) state.theme = {};
          if (!state.theme["--bg-color"]) state.theme["--bg-color"] = "#002be8";
          if (!state.theme["--grid-alt-color"]) state.theme["--grid-alt-color"] = "#ffffff";
          if (!state.theme["--header-bg"]) state.theme["--header-bg"] = "#000000";
          if (!state.theme["--accent-color"]) state.theme["--accent-color"] = "#e2ff00";
        } catch (e) {
          console.error("LOAD ERROR", e);
        }
      }
    }

    function saveToStorage(triggerCloud = true) {
      localStorage.setItem("schedule_cryo_matrix_clean", JSON.stringify(state));

      if (triggerCloud && googleAccessToken) {
        document.getElementById("sync-status").textContent = "[SYNC: PENDING CLOUD...]";
        clearTimeout(cloudDebounceTimer);
        cloudDebounceTimer = setTimeout(() => {
          saveToGoogleDrive();
        }, 1000);
      }
    }

    function toggleSettingsModal(e) {
      e.stopPropagation();
      const modal = document.getElementById("settings-modal");
      modal.classList.toggle("active");
    }

    function updateThemeColor(cssVar, color) {
      state.theme[cssVar] = color;
      applyTheme();
      saveToStorage();
    }

    function applyTheme() {
      for (const [key, val] of Object.entries(state.theme)) {
        document.documentElement.style.setProperty(key, val);
      }
      if (document.getElementById("picker-bg")) document.getElementById("picker-bg").value = state.theme["--bg-color"] || "#002be8";
      if (document.getElementById("picker-grid-alt")) document.getElementById("picker-grid-alt").value = state.theme["--grid-alt-color"] || "#ffffff";
      if (document.getElementById("picker-header")) document.getElementById("picker-header").value = state.theme["--header-bg"] || "#000000";
      if (document.getElementById("picker-accent")) document.getElementById("picker-accent").value = state.theme["--accent-color"] || "#e2ff00";
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDateKey(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getWeekOfMonth(date) {
      const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      let firstMondayOffset = firstDayOfMonth.getDay() - 1;
      if (firstMondayOffset === -1) firstMondayOffset = 6;
      const dayOfMonth = date.getDate();
      return Math.ceil((dayOfMonth + firstMondayOffset) / 7);
    }

    function isSlotPassed(slotId) {
      if (!slotId || slotId === "dock") return false;

      const parts = slotId.split("_");
      if (parts.length < 2) return false;

      const dateStr = parts[0];
      const sIdx = parseInt(parts[1], 10);
      const timeStr = TIME_SLOTS[sIdx];

      if (!timeStr) return false;

      const [hour] = timeStr.split(":").map(Number);
      const slotEndDateTime = new Date(`${dateStr}T${String(hour).padStart(2, "0")}:59:59`);

      return new Date() > slotEndDateTime;
    }

    function navigateWeek(direction) {
      currentAnchorDate.setDate(currentAnchorDate.getDate() + direction * 7);
      if (expandedDateKey && displayedWeekDates.length === 7) {
        const prevIdx = displayedWeekDates.findIndex(d => formatDateKey(d) === expandedDateKey);
        updateWeekTimeline(prevIdx >= 0 ? prevIdx : 0);
      } else {
        updateWeekTimeline(null);
      }
    }

    function navigateMonth(direction) {
      currentAnchorDate.setMonth(currentAnchorDate.getMonth() + direction);
      if (expandedDateKey && displayedWeekDates.length === 7) {
        const prevIdx = displayedWeekDates.findIndex(d => formatDateKey(d) === expandedDateKey);
        updateWeekTimeline(prevIdx >= 0 ? prevIdx : 0);
      } else {
        updateWeekTimeline(null);
      }
    }

    function jumpToCurrentDate() {
      currentAnchorDate = new Date();
      updateWeekTimeline("today");
    }

    function updateWeekTimeline(targetSelectMode = null) {
      const monday = getMonday(currentAnchorDate);
      displayedWeekDates = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        displayedWeekDates.push(d);
      }

      const midWeek = displayedWeekDates[3];
      const year = midWeek.getFullYear();
      const month = String(midWeek.getMonth() + 1).padStart(2, "0");
      const weekOfMonth = String(getWeekOfMonth(midWeek)).padStart(2, "0");
      
      document.getElementById("period-display").innerHTML = `
        <span>${year}</span><span class="slash">//</span><span>MONTH ${month}</span><span class="slash">//</span><span>WEEK ${weekOfMonth}</span>
      `;

      if (targetSelectMode === "today") {
        const todayStr = formatDateKey(new Date());
        const todayMatch = displayedWeekDates.find(d => formatDateKey(d) === todayStr);
        expandedDateKey = todayMatch ? todayStr : formatDateKey(displayedWeekDates[0]);
      } else if (typeof targetSelectMode === "number" && displayedWeekDates[targetSelectMode]) {
        expandedDateKey = formatDateKey(displayedWeekDates[targetSelectMode]);
      } else if (targetSelectMode === null) {
        expandedDateKey = null;
      }

      renderFolderWave();
      renderExpandedDrawer();
      renderAllCards();
    }

    /* 渲染 7 日漂浮波動資料夾列 */
    function renderFolderWave() {
      const waveRow = document.getElementById("folder-wave-row");
      waveRow.innerHTML = "";

      const todayStr = formatDateKey(new Date());
      const waveOffsets = [-7, 4, -5, 7, -4, 5, -6];

      displayedWeekDates.forEach((d, idx) => {
        const dateKey = formatDateKey(d);
        const mmdd = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
        const dayCardsCount = Object.values(state.cards).filter(c => c.slot && c.slot.startsWith(dateKey + "_")).length;

        const folder = document.createElement("div");
        folder.className = "day-folder";
        folder.dataset.tab = `DIR_0${idx + 1}`;
        folder.dataset.dateKey = dateKey;

        folder.style.setProperty("--base-y", `${waveOffsets[idx]}px`);
        folder.style.animationDelay = `${idx * -0.45}s`;

        if (dateKey === todayStr) {
          folder.classList.add("is-today");
        }
        if (dateKey === expandedDateKey) {
          folder.classList.add("active");
        }

        folder.innerHTML = `
          <div class="folder-top-line">
            <span>${DAY_NAMES[idx]}</span>
            <span>${dateKey === todayStr ? "★ TODAY" : "ARCH"}</span>
          </div>
          <div class="folder-date-num">${mmdd}</div>
          <div class="folder-bottom-line">
            <span>${dateKey === expandedDateKey ? "▼ OPEN" : "▶ CLICK"}</span>
            <span class="folder-count-badge">${dayCardsCount} TAPE</span>
          </div>
        `;

        folder.onclick = (e) => {
          e.stopPropagation();
          toggleDayFolder(dateKey);
        };

        folder.ondragover = (e) => {
          e.preventDefault();
          folder.classList.add("drag-over");
        };
        folder.ondragleave = () => {
          folder.classList.remove("drag-over");
        };
        folder.ondrop = (e) => {
          e.preventDefault();
          folder.classList.remove("drag-over");
          handleDropOntoFolder(e, dateKey);
        };

        waveRow.appendChild(folder);
      });
    }

    function toggleDayFolder(dateKey) {
      if (expandedDateKey === dateKey) {
        expandedDateKey = null;
      } else {
        expandedDateKey = dateKey;
      }
      renderFolderWave();
      renderExpandedDrawer();
      renderAllCards();
    }

    function closeDayDrawer(e) {
      if (e) e.stopPropagation();
      expandedDateKey = null;
      renderFolderWave();
      renderExpandedDrawer();
    }

    /* 渲染向下展開的單日時間表抽屜與動畫狀態切換 */
    function renderExpandedDrawer() {
      const container = document.getElementById("schedule-container");
      const drawer = document.getElementById("day-drawer-wrapper");
      const timelineList = document.getElementById("day-timeline-list");
      const titleEl = document.getElementById("drawer-title");

      if (!expandedDateKey) {
        container.classList.remove("is-expanded");
        drawer.classList.remove("open");
        return;
      }

      const dayIdx = displayedWeekDates.findIndex(d => formatDateKey(d) === expandedDateKey);
      const dayName = dayIdx >= 0 ? DAY_NAMES[dayIdx] : "DAY";

      container.classList.add("is-expanded");
      drawer.classList.add("open");
      titleEl.innerHTML = `
        <span>📂 DIRECTORY // ${expandedDateKey} (${dayName})</span>
        <span style="font-size: 10px; color: #aaa;">[07:00 - 23:00 TIMELINE]</span>
      `;

      timelineList.innerHTML = "";

      TIME_SLOTS.forEach((time, sIdx) => {
        const row = document.createElement("div");
        row.className = "timeline-row";

        const timeLabel = document.createElement("div");
        timeLabel.className = "timeline-time-label";
        timeLabel.textContent = time;

        const dropzone = document.createElement("div");
        dropzone.className = "timeline-slot-dropzone";
        const slotId = `${expandedDateKey}_${sIdx}`;
        dropzone.dataset.slotId = slotId;

        dropzone.ondragover = (e) => allowDrop(e);
        dropzone.ondragleave = (e) => e.currentTarget.classList.remove("drag-over");
        dropzone.ondrop = (e) => handleDrop(e, slotId);

        row.appendChild(timeLabel);
        row.appendChild(dropzone);
        timelineList.appendChild(row);
      });
    }

    /* 將卡帶直接拖曳丟入某日資料夾時，自動分配到該日第一個空閒時段並展開該資料夾 */
    function handleDropOntoFolder(e, dateKey) {
      if (!draggedCardId || !state.cards[draggedCardId]) return;

      let targetSlotId = null;
      for (let sIdx = 0; sIdx < TIME_SLOTS.length; sIdx++) {
        const candidateSlot = `${dateKey}_${sIdx}`;
        const isOccupied = Object.values(state.cards).some(c => c.slot === candidateSlot);
        if (!isOccupied) {
          targetSlotId = candidateSlot;
          break;
        }
      }

      if (!targetSlotId) {
        targetSlotId = `${dateKey}_0`;
      }

      expandedDateKey = dateKey;
      renderFolderWave();
      renderExpandedDrawer();
      handleDrop(e, targetSlotId);
      showToast(`已將卡帶排入 ${dateKey} 時程並展開資料夾！`);
    }

    function createCardElement(card) {
      const div = document.createElement("div");
      div.id = card.id;
      div.draggable = true;

      const passed = isSlotPassed(card.slot);

      let classList = "tape-card";
      if (card.id === selectedCardId) classList += " selected";
      if (passed) classList += " passed-card";
      div.className = classList;

      if (!passed) {
        div.style.backgroundColor = card.color;
      }

      div.ondragstart = (e) => {
        draggedCardId = card.id;
        isAltCloneMode = e.altKey;
        e.dataTransfer.setData("text/plain", card.id);
      };

      div.onclick = (e) => {
        e.stopPropagation();
        selectCard(card.id);
      };

      const titleSpan = document.createElement("span");
      titleSpan.textContent = card.text;

      const metaTag = document.createElement("div");
      metaTag.className = "card-meta-code";
      metaTag.textContent = passed ? "PASS" : card.id.slice(-4);

      div.appendChild(titleSpan);
      div.appendChild(metaTag);

      return div;
    }

    function renderAllCards() {
      document.querySelectorAll(".timeline-slot-dropzone").forEach(cell => cell.innerHTML = "");
      document.getElementById("dock-container").innerHTML = "";

      Object.values(state.cards).forEach(card => {
        const el = createCardElement(card);
        if (card.slot === "dock" || !card.slot) {
          document.getElementById("dock-container").appendChild(el);
        } else {
          const targetSlot = document.querySelector(`[data-slot-id="${card.slot}"]`);
          if (targetSlot) {
            targetSlot.appendChild(el);
          }
        }
      });

      displayedWeekDates.forEach(d => {
        const dateKey = formatDateKey(d);
        const count = Object.values(state.cards).filter(c => c.slot && c.slot.startsWith(dateKey + "_")).length;
        const folderEl = document.querySelector(`.day-folder[data-date-key="${dateKey}"] .folder-count-badge`);
        if (folderEl) {
          folderEl.textContent = `${count} TAPE`;
        }
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      if (e.currentTarget.classList) {
        e.currentTarget.classList.add("drag-over");
      }
    }

    function handleDrop(e, targetSlotId) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");

      if (!draggedCardId || !state.cards[draggedCardId]) return;

      const sourceCard = state.cards[draggedCardId];
      const isAltPressed = e.altKey || isAltCloneMode;

      if (isAltPressed) {
        const newId = "CRYO_" + Date.now().toString().slice(-6);
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard) existingCard.slot = "dock";
        }
        state.cards[newId] = {
          id: newId,
          text: sourceCard.text,
          color: sourceCard.color,
          slot: targetSlotId
        };
        selectCard(newId);
      } else {
        const previousSlot = sourceCard.slot;
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard && existingCard.id !== sourceCard.id) {
            existingCard.slot = previousSlot;
          }
        }
        sourceCard.slot = targetSlotId;
        selectCard(sourceCard.id);
      }

      draggedCardId = null;
      isAltCloneMode = false;
      saveToStorage();
      renderAllCards();
    }

    function selectCard(cardId) {
      selectedCardId = cardId;
      updateWorkbenchUI();
      renderAllCards();
    }

    function deselectCard(e) {
      if (e.target.classList.contains("schedule-container") || 
          e.target.classList.contains("folder-wave-stage") ||
          e.target.classList.contains("folder-wave-row") ||
          e.target.classList.contains("drawer-scroll-area") ||
          e.target.classList.contains("timeline-slot-dropzone") ||
          e.target.classList.contains("dock-slots")) {
        selectedCardId = null;
        updateWorkbenchUI();
        renderAllCards();
      }
    }

    function updateWorkbenchUI() {
      const textInput = document.getElementById("edit-card-text");
      const colorInput = document.getElementById("edit-card-color");
      const btnDuplicate = document.getElementById("btn-duplicate");
      const btnDelete = document.getElementById("btn-delete");

      if (selectedCardId && state.cards[selectedCardId]) {
        const card = state.cards[selectedCardId];
        textInput.disabled = false;
        colorInput.disabled = false;
        btnDuplicate.disabled = false;
        btnDelete.disabled = false;

        textInput.value = card.text;
        colorInput.value = card.color;
      } else {
        textInput.disabled = true;
        colorInput.disabled = true;
        btnDuplicate.disabled = true;
        btnDelete.disabled = true;

        textInput.value = "";
        textInput.placeholder = "未選取卡帶";
        colorInput.value = "#ffffff";
      }
    }

    function handleCreateCard() {
      const textInput = document.getElementById("new-card-text");
      const colorInput = document.getElementById("new-card-color");
      const text = textInput.value.trim();

      if (!text) {
        textInput.focus();
        return;
      }

      const id = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[id] = {
        id: id,
        text: text,
        color: colorInput.value,
        slot: "dock"
      };

      textInput.value = "";
      selectCard(id);
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedText(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].text = val;
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedColor(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].color = val;
      saveToStorage();
      renderAllCards();
    }

    function handleDuplicateSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      const orig = state.cards[selectedCardId];
      const newId = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[newId] = {
        id: newId,
        text: orig.text,
        color: orig.color,
        slot: "dock"
      };
      selectCard(newId);
      saveToStorage();
      renderAllCards();
    }

    function handleDeleteSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      delete state.cards[selectedCardId];
      selectedCardId = null;
      updateWorkbenchUI();
      saveToStorage();
      renderFolderWave();
      renderAllCards();
    }

    document.getElementById("new-card-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCreateCard();
    });

    window.onload = init;
  </script>
</body>
</html>
