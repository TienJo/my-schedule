<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRYO ARCHIVE // SCHEDULE MATRIX</title>
  <style>
    :root {
      --bg-color: #002be8;
      --header-bg: #000000;
      --cell-bg: #031ebd;
      --border-color: #000000;
      --text-color: #ffffff;
      --dock-bg: #000000;
      --accent-color: #e2ff00;
      --accent-dark: #000000;
      --card-default: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Space Mono", "Consolas", "Courier New", monospace, -apple-system, sans-serif;
      text-transform: uppercase;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 頂部科幻終端抬頭列 */
    header {
      background-color: var(--header-bg);
      border-bottom: 3px solid #000000;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 20;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 15px;
      color: #ffffff;
    }

    .status-tag {
      background: var(--accent-color);
      color: #000000;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 0px;
      padding: 5px 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 1px;
      transition: all 0.1s;
    }

    button.accent {
      background-color: var(--accent-color);
      border-color: #000000;
      color: #000000;
    }

    button.secondary {
      background-color: #002be8;
      border-color: #ffffff;
      color: #ffffff;
    }

    button.danger {
      background-color: #ff3344;
      border-color: #000000;
      color: #ffffff;
    }

    button:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px #000000;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #666;
    }

    .color-picker-label {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      color: #ffffff;
      border: 1px solid #444;
      padding: 2px 6px;
      background: #111;
    }

    input[type="color"] {
      border: 1px solid #000;
      width: 20px;
      height: 20px;
      border-radius: 0px;
      cursor: pointer;
      background: none;
    }

    input[type="text"] {
      background-color: #000000;
      color: var(--accent-color);
      border: 2px solid #333;
      border-radius: 0px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      background-color: #050505;
    }

    /* 日程表主結構 */
    .schedule-container {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 3px solid #000000;
      background: #000000;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);
    }

    .grid-table th, .grid-table td {
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .grid-table th {
      background-color: #000000;
      color: #ffffff;
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #ffffff;
    }

    .time-col {
      width: 75px;
      font-size: 11px;
      font-weight: 800;
      background-color: #000000;
      color: var(--accent-color);
      letter-spacing: 1px;
      border-right: 2px solid #ffffff;
    }

    .slot-cell {
      background-color: var(--cell-bg);
      height: 48px;
      vertical-align: middle;
      padding: 2px;
      transition: background-color 0.1s;
      position: relative;
    }

    .slot-cell.drag-over {
      background-color: var(--accent-color) !important;
      outline: 2px dashed #000000;
    }

    /* 底部卡帶終端機 */
    .dock-area {
      background-color: var(--dock-bg);
      border-top: 4px solid #ffffff;
      padding: 12px 16px;
      height: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0px -4px 10px rgba(0,0,0,0.5);
    }

    .workbench-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background-color: #0a0a0a;
      padding: 8px 12px;
      border: 1px solid #222;
    }

    .workbench-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workbench-divider {
      width: 2px;
      height: 24px;
      background-color: #333333;
    }

    .dock-slots {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      padding: 6px;
      background: #050505;
      border: 1px solid #222;
    }

    /* 工業風卡帶 */
    .tape-card {
      border-radius: 0px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #000000;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 96%;
      margin: 0 auto;
      height: 38px;
      padding: 0 10px;
      border: 2px solid #000000;
      box-shadow: 3px 3px 0px #000000;
      position: relative;
    }

    .tape-card::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 3px;
      background: #000000;
      opacity: 0.4;
    }

    .dock-slots .tape-card {
      width: 170px;
      flex-shrink: 0;
    }

    .tape-card.selected {
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color), 3px 3px 0px #000000;
    }

    .tape-card:active {
      cursor: grabbing;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000000;
    }

    .tape-card span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      padding-left: 6px;
    }

    .card-meta-code {
      font-size: 8px;
      opacity: 0.6;
      pointer-events: none;
      font-weight: bold;
    }

    .hint-text {
      font-size: 10px;
      color: #888888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 終端頂部 HUD -->
  <header>
    <div class="brand-title">
      <span>CRYO ARCHIVE // REVIVAL</span>
      <span class="status-tag">ACTIVE SYS</span>
    </div>

    <div class="controls-group">
      <button class="secondary" onclick="exportData()">EXPORT.DAT</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">LOAD.DAT</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)" />
    </div>

    <!-- 色彩自訂 -->
    <div class="controls-group">
      <label class="color-picker-label">ENV.BG
        <input type="color" id="picker-bg" value="#002be8" onchange="updateThemeColor('--bg-color', this.value)" />
      </label>
      <label class="color-picker-label">PANEL.HEADER
        <input type="color" id="picker-header" value="#000000" onchange="updateThemeColor('--header-bg', this.value)" />
      </label>
      <label class="color-picker-label">CELL.VOID
        <input type="color" id="picker-cell" value="#031ebd" onchange="updateThemeColor('--cell-bg', this.value)" />
      </label>
    </div>
  </header>

  <!-- 矩陣槽位區域 -->
  <div class="schedule-container" onclick="deselectCard(event)">
    <table class="grid-table">
      <thead>
        <tr>
          <th class="time-col">T-BLOCK</th>
          <th>MON // 01</th>
          <th>TUE // 02</th>
          <th>WED // 03</th>
          <th>THU // 04</th>
          <th>FRI // 05</th>
          <th>SAT // 06</th>
          <th>SUN // 07</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </div>

  <!-- 下方卡帶製造工廠 -->
  <div class="dock-area">
    <div class="workbench-toolbar">
      <!-- 建立卡帶 -->
      <div class="workbench-section">
        <input type="text" id="new-card-text" placeholder="SPECIFY DIRECTIVE..." style="width: 170px;" />
        <input type="color" id="new-card-color" value="#ffffff" title="CARTRIDGE COLOR" />
        <button class="accent" onclick="handleCreateCard()">+ FABRICATE</button>
      </div>

      <div class="workbench-divider"></div>

      <!-- 編輯已選定卡帶 -->
      <div class="workbench-section">
        <span style="font-size: 10px; font-weight: 900; color: #888;">TARGET CONFIG:</span>
        <input type="text" id="edit-card-text" placeholder="NO SELECTION" style="width: 170px;" disabled oninput="handleUpdateSelectedText(this.value)" />
        <input type="color" id="edit-card-color" value="#ffffff" disabled onchange="handleUpdateSelectedColor(this.value)" />
        <button id="btn-duplicate" class="secondary" disabled onclick="handleDuplicateSelected()">CLONE</button>
        <button id="btn-delete" class="danger" disabled onclick="handleDeleteSelected()">PURGE</button>
      </div>

      <span class="hint-text" style="margin-left: auto;">
        [ALT + DRAG]: INSTANT CLONE / [CLICK]: ENGAGE WORKBENCH
      </span>
    </div>

    <!-- 暫存庫 -->
    <div class="dock-slots" id="dock-container" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'dock')" onclick="deselectCard(event)"></div>
  </div>

  <script>
    const TIME_SLOTS = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
    const DAYS = [0, 1, 2, 3, 4, 5, 6];

    let state = {
      theme: {
        "--bg-color": "#002be8",
        "--header-bg": "#000000",
        "--cell-bg": "#031ebd"
      },
      cards: {}
    };

    let draggedCardId = null;
    let isAltCloneMode = false;
    let selectedCardId = null;

    function init() {
      loadFromStorage();
      renderGrid();
      applyTheme();
      renderAllCards();
      updateWorkbenchUI();
    }

    function saveToStorage() {
      localStorage.setItem("schedule_marathon_edition", JSON.stringify(state));
    }

    function loadFromStorage() {
      const saved = localStorage.getItem("schedule_marathon_edition");
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("LOAD ERROR", e);
        }
      }
    }

    function updateThemeColor(cssVar, color) {
      state.theme[cssVar] = color;
      applyTheme();
      saveToStorage();
    }

    function applyTheme() {
      for (const [key, val] of Object.entries(state.theme)) {
        document.documentElement.style.setProperty(key, val);
      }
      document.getElementById("picker-bg").value = state.theme["--bg-color"];
      document.getElementById("picker-header").value = state.theme["--header-bg"];
      document.getElementById("picker-cell").value = state.theme["--cell-bg"];
    }

    function renderGrid() {
      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      TIME_SLOTS.forEach((time, sIdx) => {
        const row = document.createElement("tr");

        const timeTd = document.createElement("td");
        timeTd.className = "time-col";
        timeTd.textContent = time;
        row.appendChild(timeTd);

        DAYS.forEach((dIdx) => {
          const td = document.createElement("td");
          td.className = "slot-cell";
          const slotId = `slot_${dIdx}_${sIdx}`;
          td.dataset.slotId = slotId;
          td.ondragover = (e) => allowDrop(e);
          td.ondragleave = (e) => e.currentTarget.classList.remove("drag-over");
          td.ondrop = (e) => handleDrop(e, slotId);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    function createCardElement(card) {
      const div = document.createElement("div");
      div.className = "tape-card" + (card.id === selectedCardId ? " selected" : "");
      div.id = card.id;
      div.draggable = true;
      div.style.backgroundColor = card.color;

      div.ondragstart = (e) => {
        draggedCardId = card.id;
        isAltCloneMode = e.altKey;
        e.dataTransfer.setData("text/plain", card.id);
      };

      div.onclick = (e) => {
        e.stopPropagation();
        selectCard(card.id);
      };

      const titleSpan = document.createElement("span");
      titleSpan.textContent = card.text;

      const metaTag = document.createElement("div");
      metaTag.className = "card-meta-code";
      metaTag.textContent = card.id.slice(-4);

      div.appendChild(titleSpan);
      div.appendChild(metaTag);

      return div;
    }

    function renderAllCards() {
      document.querySelectorAll(".slot-cell").forEach(cell => cell.innerHTML = "");
      document.getElementById("dock-container").innerHTML = "";

      Object.values(state.cards).forEach(card => {
        const el = createCardElement(card);
        if (card.slot === "dock" || !card.slot) {
          document.getElementById("dock-container").appendChild(el);
        } else {
          const targetSlot = document.querySelector(`[data-slot-id="${card.slot}"]`);
          if (targetSlot) {
            targetSlot.appendChild(el);
          } else {
            document.getElementById("dock-container").appendChild(el);
          }
        }
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      if (e.currentTarget.classList) {
        e.currentTarget.classList.add("drag-over");
      }
    }

    function handleDrop(e, targetSlotId) {
      e.preventDefault();
      e.currentTarget.classList.remove("drag-over");

      if (!draggedCardId || !state.cards[draggedCardId]) return;

      const sourceCard = state.cards[draggedCardId];
      const isAltPressed = e.altKey || isAltCloneMode;

      if (isAltPressed) {
        const newId = "CRYO_" + Date.now().toString().slice(-6);
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard) existingCard.slot = "dock";
        }
        state.cards[newId] = {
          id: newId,
          text: sourceCard.text,
          color: sourceCard.color,
          slot: targetSlotId
        };
        selectCard(newId);
      } else {
        const previousSlot = sourceCard.slot;
        if (targetSlotId !== "dock") {
          const existingCard = Object.values(state.cards).find(c => c.slot === targetSlotId);
          if (existingCard && existingCard.id !== sourceCard.id) {
            existingCard.slot = previousSlot;
          }
        }
        sourceCard.slot = targetSlotId;
        selectCard(sourceCard.id);
      }

      draggedCardId = null;
      isAltCloneMode = false;
      saveToStorage();
      renderAllCards();
    }

    function selectCard(cardId) {
      selectedCardId = cardId;
      updateWorkbenchUI();
      renderAllCards();
    }

    function deselectCard(e) {
      if (e.target.classList.contains("schedule-container") || 
          e.target.classList.contains("dock-slots") || 
          e.target.tagName === "TABLE" ||
          e.target.tagName === "TD") {
        selectedCardId = null;
        updateWorkbenchUI();
        renderAllCards();
      }
    }

    function updateWorkbenchUI() {
      const textInput = document.getElementById("edit-card-text");
      const colorInput = document.getElementById("edit-card-color");
      const btnDuplicate = document.getElementById("btn-duplicate");
      const btnDelete = document.getElementById("btn-delete");

      if (selectedCardId && state.cards[selectedCardId]) {
        const card = state.cards[selectedCardId];
        textInput.disabled = false;
        colorInput.disabled = false;
        btnDuplicate.disabled = false;
        btnDelete.disabled = false;

        textInput.value = card.text;
        colorInput.value = card.color;
      } else {
        textInput.disabled = true;
        colorInput.disabled = true;
        btnDuplicate.disabled = true;
        btnDelete.disabled = true;

        textInput.value = "";
        textInput.placeholder = "NO SELECTION";
        colorInput.value = "#ffffff";
      }
    }

    function handleCreateCard() {
      const textInput = document.getElementById("new-card-text");
      const colorInput = document.getElementById("new-card-color");
      const text = textInput.value.trim();

      if (!text) {
        textInput.focus();
        return;
      }

      const id = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[id] = {
        id: id,
        text: text,
        color: colorInput.value,
        slot: "dock"
      };

      textInput.value = "";
      selectCard(id);
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedText(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].text = val;
      saveToStorage();
      renderAllCards();
    }

    function handleUpdateSelectedColor(val) {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      state.cards[selectedCardId].color = val;
      saveToStorage();
      renderAllCards();
    }

    function handleDuplicateSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      const orig = state.cards[selectedCardId];
      const newId = "CRYO_" + Date.now().toString().slice(-6);
      state.cards[newId] = {
        id: newId,
        text: orig.text,
        color: orig.color,
        slot: "dock"
      };
      selectCard(newId);
      saveToStorage();
      renderAllCards();
    }

    function handleDeleteSelected() {
      if (!selectedCardId || !state.cards[selectedCardId]) return;
      delete state.cards[selectedCardId];
      selectedCardId = null;
      updateWorkbenchUI();
      saveToStorage();
      renderAllCards();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "CRYO_SCHEDULE_DUMP.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.cards && imported.theme) {
            state = imported;
            selectedCardId = null;
            saveToStorage();
            applyTheme();
            renderAllCards();
            updateWorkbenchUI();
          }
        } catch (err) {
          alert("SYS_ERR: INVALID ARCHIVE DATA");
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("new-card-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCreateCard();
    });

    window.onload = init;
  </script>
</body>
</html>
